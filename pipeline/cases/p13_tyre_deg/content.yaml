# P13 · Where is the tyre degradation cliff? (OpenF1 race laps, dry races 2023-2025)
id: p13_tyre_deg
number: 13
domain: f1
title: Where is the tyre degradation cliff?
tier: A
decision_maker: Race strategist at a Formula 1 team
decision: How long can a stint run on each compound before an extra pit stop pays for itself, and is there a cliff to plan around?
money_at_stake: >-
  A pit stop costs time in the pit lane. Old tyres cost time every lap. Getting the balance wrong loses positions, and
  in a championship decided by points one strategy call can be worth millions in prize money.
concepts: [fuel-corrected degradation, identification and collinearity, fixed effects, segmented regression,
           leave-one-group-out validation, censoring, sensitivity analysis, decision thresholds]
sources: []
datasets: [openf1_laps_7953, openf1_stints_7953, openf1_race_control_7953, openf1_intervals_7953]
allowed_literals: ["2023-24", "2023", "2024", "2025", "2026", "Formula 1", "OpenF1"]

steps:
# ============================================================== BRIEF
- id: s01_brief
  phase: brief
  type: mcq
  title: What is being decided?
  body: >-
    You work for a race strategist. Tyres lose grip as they age, and fresh tyres cost a pit stop. Our data: every lap
    of the {expected.n_races} Grand Prix races from 2023 to 2025 in the free OpenF1 API, with lap times, tyre compound,
    tyre age, Safety Car messages and the gap to the car ahead. {expected.n_wet_races} wet races are set aside,
    leaving {expected.n_dry_races} dry races and {expected.n_laps_dry} laps.
  prompt: Which decision does this analysis inform?
  options:
    - id: a
      text: How long a stint can run on each compound before an extra stop pays for itself
      correct: true
      explanation: The output is a stint length per compound, with the pit loss it is weighed against.
    - id: b
      text: Which driver is fastest
      explanation: Driver speed is a nuisance here. The model removes it with a fixed effect.
    - id: c
      text: Which team will win the championship
      explanation: That is a forecast, not a strategy decision you can act on in a race.
    - id: d
      text: How to make tyres last longer
      explanation: Tyre design belongs to the supplier. The strategist decides when to change them.

# ============================================================== FRAME
- id: s02_question
  phase: frame
  type: mcq
  title: Frame the question
  prompt: Which question can this data answer AND the strategist act on?
  options:
    - id: a
      text: Once fuel burn is removed, how much lap time does each extra lap of tyre age cost on each compound, and does the loss suddenly accelerate?
      correct: true
      explanation: It isolates the tyre effect from the fuel effect and asks about the cliff, which is what sets stop timing.
    - id: b
      text: Are lap times faster at the end of the race than at the start?
      explanation: Yes, mostly because the car is lighter. That says nothing about the tyres.
    - id: c
      text: Which compound has the fastest single lap?
      explanation: Peak speed ignores how quickly it fades, which is the whole strategy trade-off.
    - id: d
      text: Do pit stops cause crashes?
      explanation: There is no data here to answer that, and it doesn't set stint length.

- id: s03_kpis
  phase: frame
  type: kpi_builder
  title: Choose the KPIs
  prompt: Select every KPI that helps decide stint length.
  options:
    - id: deg
      text: Lap-time loss per lap of tyre age, by compound, with fuel burn removed
      correct: true
      explanation: The wear rate is the cost side of keeping the tyre.
    - id: cliff
      text: The tyre age at which the loss accelerates (if it does), checked on races the model never saw
      correct: true
      explanation: A cliff would cap the stint regardless of the average wear rate.
    - id: pitloss
      text: Time lost by a pit stop (in-lap plus out-lap against a normal lap)
      correct: true
      explanation: The price of fresh tyres. Without it there is no trade-off to compute.
    - id: raw_trend
      text: The raw trend of lap time over the race
      explanation: It mixes fuel burn, track evolution and wear. On its own it can even make tyres look like they improve.
    - id: fastest
      text: The fastest lap of the race
      explanation: One lap says nothing about how a tyre fades over a stint.

# ============================================================== PREDICT
- id: s04_predict_data
  phase: predict
  type: data_expectation
  title: Predict the data before you load it
  dataset: openf1_laps_7953
  prompt: >-
    Before you look: describe the OpenF1 race data. One lap row = ? Where do compound and tyre age come from? Which laps
    will have odd times, and how would you know a lap ran behind a Safety Car or stuck behind another car?
  scaffold: predict_data
  analysis_pointer: Think about what makes a lap slow that has nothing to do with the tyres.
  redo_step: Read the clean log and the drop counts.
  model_answer: >-
    One row per driver per lap, with the lap time in seconds and a flag for laps that start from the pit lane. Compound
    and tyre age are not on the lap row: they come from a separate stints table (first lap, last lap, compound, and the
    tyre's age when fitted, which is not always zero because used sets from qualifying are common). I expect odd laps:
    lap one from a standing start, in-laps and out-laps around pit stops, laps behind a Safety Car or Virtual Safety
    Car (found in the race-control messages), and laps stuck behind another car (the gap to the car ahead comes from a
    separate intervals feed). Some laps will have no time at all. Traps: joining laps to stints, used tyres, timestamps
    in UTC, and laps of lapped cars running at a different lap count from the leader.
  rubric:
    points:
      - id: grain
        label: Grain and tables
        weight: 20
        paraphrases:
          - one row per driver per lap with the lap time
          - compound and tyre age come from a separate stints table that must be joined
          - lap rows have no tyre information so stints must be matched by lap range
        keywords: [[driver, lap, row], [stint, join, separate, table, match]]
        hint: Where does the tyre information live?
        why: The model needs tyre fields on every lap row.
      - id: odd_laps
        label: Laps that are not racing pace
        weight: 30
        paraphrases:
          - lap one in-laps and out-laps are slow for reasons other than tyres
          - laps behind the safety car or virtual safety car are neutralised
          - pit laps include the pit lane time
        keywords: [[lap one, first lap, start, in-lap, out-lap, pit, safety car, VSC, neutral]]
        hint: Which laps are slow for reasons that have nothing to do with tyre wear?
        why: Non-racing laps would swamp a tenth-of-a-second effect.
      - id: traffic
        label: Traffic
        weight: 20
        paraphrases:
          - laps stuck behind another car are slower because of dirty air
          - the gap to the car ahead identifies traffic laps
          - a car following closely loses time and overheats its tyres
        keywords: [[traffic, dirty air, behind, following, gap, interval]]
        hint: What slows a car that is following closely?
        why: Traffic looks exactly like wear in a lap time.
      - id: used_tyres
        label: Tyre age is not stint lap count
        weight: 30
        paraphrases:
          - tyres can start a stint already used so age is not zero
          - tyre age equals the age when fitted plus laps run in the stint
          - used sets from qualifying start with some laps on them
        keywords: [[used, already, not zero, age at start, fitted, qualifying]]
        hint: Is every set fitted brand new?
        why: Counting stint laps instead of tyre age shifts every wear curve.
    red_flags:
      - id: all_laps_fine
        critical: false
        penalty: 15
        paraphrases:
          - every lap time measures racing pace
        feedback: Lap one, pit laps, Safety Car laps and traffic laps don't measure the tyres.
      - id: age_is_stint_lap
        critical: false
        penalty: 10
        paraphrases:
          - tyre age is just the lap number within the stint
        feedback: Used sets start with laps on them. Tyre age = age when fitted + laps in the stint.
      - id: raw_is_wear
        critical: false
        penalty: 15
        paraphrases:
          - raw lap times will show tyre wear directly
        feedback: Fuel burn makes laps faster through the race. Raw lap times mix it with wear.

# ============================================================== DATA
- id: s05_read_rules
  phase: data
  type: code_read
  title: Read the drop rules
  snippet: {file: clean.py, name: drop_rules}
  prompt: >-
    This is the real code that decides which laps are kept. Each lap gets the FIRST reason that applies. Why does the
    order matter for the counts in the clean log, and which rules need a feed other than the lap table?

- id: s06_fill_age
  phase: data
  type: code_fill
  title: Compute tyre age
  snippet: {file: clean.py, name: tyre_age}
  prompt: Each stint gives the age of the tyre when it was fitted and the stint's first lap. Fill the blank that gives the tyre age on any lap of the stint.
  blanks:
    - token: 'laps["tyre_age_at_start"] + (laps["lap_number"] - laps["lap_start"])'
      accept: ['laps["tyre_age_at_start"] + laps["lap_number"] - laps["lap_start"]', "tyre_age_at_start + (lap_number - lap_start)",
               "tyre_age_at_start + lap_number - lap_start"]

- id: s07_justify_traffic
  phase: data
  type: cleaning_justification
  title: Justify dropping traffic laps
  transform: drop_traffic
  prompt: >-
    The pipeline dropped laps where the median gap to the car ahead was under {expected.traffic_gap_s} seconds:
    {expected.n_drop_traffic} laps, {expected.share_drop_traffic} of all dry-race laps. Justify it: what was done, why,
    the alternative you rejected, and what you checked.
  scaffold: justify_clean
  analysis_pointer: Think about what dirty air does to lap time and tyre temperature, and when traffic happens in a stint.
  redo_step: Compare the wear slopes with the looser and stricter gap rules.
  model_answer: >-
    Laps where the car spent most of the lap less than {expected.traffic_gap_s} seconds behind another car were
    dropped and counted ({expected.n_drop_traffic} laps). A following car loses downforce in dirty air and overheats its
    tyres, so the lap is slow for reasons that look exactly like wear. Traffic is also not random over a stint: it
    clusters early (on fresh tyres after a stop, cars rejoin in the pack) and in battles, so it would bias the wear
    slope, not just add noise. I rejected keeping them, and I rejected a much stricter rule that would throw away
    most laps. The threshold is a choice, so I checked it: with a looser rule ({expected.n_laps_gap05} laps kept) the
    hard-tyre slope is {expected.deg_hard_gap05} and the soft slope {expected.deg_soft_gap05}; with a stricter rule
    ({expected.n_laps_gap20} laps) hards are {expected.deg_hard_gap20}, against {expected.deg_hard} in the main model.
    So the slope moves by up to about a tenth with the rule, which is worth reporting, but the stint decision doesn't
    change. One more caution: a car on fresh tyres catches the car ahead, so the traffic rule is itself linked to pace.
  rubric:
    points:
      - id: what
        label: What was done
        weight: 20
        paraphrases:
          - laps where the car followed another closely were dropped and counted
          - laps with a small median gap to the car ahead were removed
          - traffic laps were excluded using the intervals feed
        keywords: [[gap, behind, following, traffic, interval], [drop, remove, exclude, counted]]
        hint: Which laps went?
        why: Start with a plain description.
      - id: why
        label: Why traffic mimics wear
        weight: 30
        paraphrases:
          - dirty air slows the car and overheats the tyres so the lap looks like wear
          - following closely costs time that is not tyre degradation
          - traffic is slow for reasons other than tyre age
        keywords: [[dirty air, downforce, overheat, follow, traffic], [wear, degrad, tyre, mimic, look like]]
        hint: What does a following car lose?
        why: A filter is justified by its mechanism.
      - id: bias
        label: Bias, not just noise
        weight: 20
        paraphrases:
          - traffic is not random over a stint so it would bias the slope
          - cars rejoin in traffic on fresh tyres after a stop
          - battles cluster at particular tyre ages
        keywords: [[bias, not random, cluster, fresh, rejoin, early], [slope, stint]]
        hint: When in a stint does traffic usually happen?
        why: Noise widens intervals; bias moves the answer.
      - id: check
        label: Sensitivity check
        weight: 30
        paraphrases:
          - with a looser or stricter gap rule the slope moves a little but the decision does not change
          - the hard tyre slope is {expected.deg_hard_gap05} with a looser rule against {expected.deg_hard} in the main model
          - the threshold is a choice so it was varied
        keywords: [[looser, stricter, varied, sensitivity, other rule, threshold, check], [same, barely, similar, slope, moves, change]]
        numeric: {key: deg_hard_gap05, tolerance: 0.003}
        hint: What happens to the slope if the gap rule changes?
        why: A judgement call needs a check that could have broken it.
    red_flags:
      - id: outliers
        critical: false
        penalty: 15
        paraphrases:
          - traffic laps were removed because they are outliers
        feedback: They aren't statistical outliers. They're a different mechanism (dirty air).
      - id: helps_result
        critical: true
        penalty: 30
        paraphrases:
          - we removed them because the slope looked better without them
        feedback: Never justify a filter by its effect on the result.
      - id: silent
        critical: false
        penalty: 15
        paraphrases:
          - drop them without recording how many
        feedback: Every drop needs a logged count and reason.

# ============================================================== EXPLORE
- id: s08_fuel_card
  phase: explore
  type: concept_card
  title: Fuel burn hides tyre wear
  chart: p13_example_stint
  prompt: A car starts heavy and gets lighter every lap. That makes laps faster while the tyres get slower.
  body: >-
    Take a typical long hard-tyre stint: of the {expected.n_long_hard_stints} hard stints with many clean laps, the one
    in the middle for wear is {expected.example_stint_laps} laps at {expected.example_stint_circuit}
    ({expected.example_stint_year}). Its raw lap times trend by {expected.example_raw_slope} seconds per lap: the
    tyres seem to get better with age. Across all clean laps, each lap of the race is worth {expected.fuel_slope}
    seconds (fuel burn plus the track gaining rubber). Take that out and the same stint loses
    {expected.example_corrected_slope} seconds per lap of age. That is the tyre wear the strategist cares about.

- id: s09_chart_wear
  phase: explore
  type: chart_explain
  title: Read the wear curves
  chart: p13_wear_curves
  prompt: Explain what this chart shows and what it does NOT show.
  scaffold: chart_6q
  analysis_pointer: Compare the three compounds' slopes, then look at how far right each line goes and why.
  redo_step: Look at the fuel-controlled column of the wear table. {captured.wear_table}
  model_answer: >-
    The x-axis is tyre age in laps; the y-axis is lap time lost against the freshest age shown, after removing driver,
    race and the lap-number (fuel) effect. Dots are averages per age; dashed lines are the straight-line fits. Softs wear
    fastest ({expected.deg_soft} s per lap of age). Mediums ({expected.deg_medium}) and hards ({expected.deg_hard}) wear
    at about the same rate: their confidence intervals overlap, so the data can't rank them. Over a
    {expected.stint_len_median_hard}-lap hard stint that adds up to more than a second a lap by the end. The lines stop at
    different ages because teams pit before tyres get very old, so the oldest ages rest on few laps from the stints that
    were kept out longest, which may not be typical. It can't show what happens beyond the ages teams actually ran, and
    it averages over circuits that differ a lot. So what: the wear rate per compound feeds the stint
    decision, but a cliff can't be read off a curve that is thin at the end.
  rubric:
    points:
      - id: axes
        label: What is plotted
        weight: 15
        paraphrases:
          - tyre age on the x axis and lap time lost against fresh tyres on the y axis after removing fuel
          - the curves show fuel corrected loss by tyre age for each compound
          - averages per age with straight line fits
        keywords: [[age, x-axis, horizontal], [loss, slower, lap time, y-axis], [fuel, corrected, removed]]
        hint: Name both axes and what was removed.
        why: A chart you can't read is decoration.
      - id: order
        label: Compound rates with numbers
        weight: 25
        paraphrases:
          - softs wear fastest at {expected.deg_soft} seconds per lap while mediums and hards are similar
          - hard tyres lose about {expected.deg_hard} seconds per lap of age
          - mediums and hards wear at about the same rate
        keywords: [[soft, medium, hard], [fast, steep, more, per lap, order, similar, same]]
        numeric: {key: deg_soft, tolerance: 0.005}
        hint: Quote the wear rate of each compound. Can you tell mediums and hards apart?
        why: The size of the effect sets the stint length.
      - id: censor
        label: Thin tail (censoring)
        weight: 25
        paraphrases:
          - teams pit before tyres get old so the oldest ages have few laps
          - the lines stop because stints end before the tyre is worn out
          - the longest stints may not be typical of all stints
        keywords: [[pit, stop, end, few, censor, survivor, hold up, typical], [old, oldest, long, tail]]
        hint: Why do the lines stop where they stop?
        why: Missing data at the end is the reason a cliff is hard to find.
      - id: limits
        label: What it can't show
        weight: 15
        paraphrases:
          - it cannot show wear beyond the ages teams actually ran
          - it averages over circuits that differ
          - it cannot separate fuel from track evolution
        keywords: [[beyond, circuit, average, track evolution, cannot, can't]]
        hint: What would you need to see past the end of each line?
        why: The reader must know the limits of the evidence.
      - id: so_what
        label: So what
        weight: 20
        paraphrases:
          - the wear rate per compound feeds the stint length decision
          - use the slopes to compare against the pit loss
          - a cliff cannot be read from a curve that is thin at the end
        keywords: [[stint, pit, decision, strategy, use], [rate, slope, cliff]]
        hint: How does the strategist use these slopes?
        why: Charts exist to support a decision.
    red_flags:
      - id: improve
        critical: true
        penalty: 30
        paraphrases:
          - lap times get faster so tyres improve with age
        feedback: That is fuel burn. Remove the lap-number effect and the tyres get slower with age.
      - id: cliff_visible
        critical: false
        penalty: 15
        paraphrases:
          - the chart clearly shows a cliff at the end of each line
        feedback: The end of each line rests on few laps. Test a break out of sample before calling it a cliff.
      - id: soft_same
        critical: false
        penalty: 15
        paraphrases:
          - softs and hards wear at the same rate
        feedback: Softs wear clearly faster. It is mediums and hards whose intervals overlap.

# ============================================================== MODEL
- id: s10_method
  phase: model
  type: mcq
  title: Choose the model
  prompt: Which model can separate tyre wear from fuel burn?
  options:
    - id: a
      text: Lap time on tyre age and lap number with a fixed effect for each driver in each race
      correct: true
      explanation: >-
        Across a pit stop tyre age resets while lap number keeps rising, so the two can be told apart. The fixed effect
        removes driver, car and circuit speed.
    - id: b
      text: Lap time on tyre age and lap number with a fixed effect for each stint
      explanation: Inside one stint tyre age and lap number rise together exactly, so the model cannot separate them.
    - id: c
      text: Average lap time by tyre age across all races
      explanation: That mixes fast and slow circuits and cars, and keeps the fuel effect inside.
    - id: d
      text: A random forest predicting lap time
      explanation: Good at prediction, but it doesn't give a per-lap wear rate you can put into a stop decision.

- id: s11_read_fe
  phase: model
  type: code_read
  title: Read the fixed-effect fit
  snippet: {file: analyse.py, name: fit_fe}
  prompt: >-
    This fits the model by subtracting each driver-race's mean from every variable, then running least squares. Why are
    the standard errors clustered by race and not by lap?

- id: s12_plan_challenge
  phase: model
  type: plan_challenge
  title: Attack this plan
  flawed_plan: >-
    "I'll regress lap time on tyre age with a fixed effect for every stint and add lap number to control for fuel,
    as the textbook says. Then I'll fit a break in the line for each compound on all the data and report the best one
    as the cliff."
  prompt: >-
    Challenge this plan: what does each part assume, why does that fail here, how would you fix it, and how would you
    check the fix?
  scaffold: challenge_plan
  analysis_pointer: Write tyre age and lap number for three consecutive laps of one stint. Then think about where the break is chosen and where it is tested.
  redo_step: Look at the identification results and the leave-one-race-out table.
  model_answer: >-
    First, inside a stint tyre age and lap number rise by one together, so after removing stint means they are the same
    variable: the correlation is {expected.within_stint_corr_age_lap} and the design has rank {expected.stint_fe_rank}
    instead of {expected.stint_fe_columns}. The model can't tell fuel from wear. Drop lap number and the slope mixes
    them, which is why hards seem to improve ({expected.naive_slope_hard}). Fix: a fixed effect for each driver in each
    race. Pit stops reset tyre age but not lap number, and {expected.share_multi_stint} of driver-races have clean laps
    in two or more stints, so the model can separate them: hards then lose {expected.deg_hard} s per lap of age, with
    a lap effect of {expected.fuel_slope}. Second, the break chosen as the best fit on all the data will always look
    like an improvement. Choose it on the other races and score it on a race the model never saw, one race at a time.
    Done that way the break cuts held-out error by under one percent and bends the wrong way, so
    {expected.n_compounds_with_cliff} compounds show a cliff.
  rubric:
    points:
      - id: collinear
        label: Stint fixed effect makes age and lap number identical
        weight: 30
        paraphrases:
          - inside a stint tyre age and lap number go up together so they cannot be separated
          - with a stint fixed effect fuel and wear are perfectly collinear
          - the design matrix loses a column of rank
        keywords: [[stint], [collinear, together, same, identical, rank, cannot separate, perfectly]]
        hint: Write age and lap number for three laps of one stint.
        why: An unidentified model gives a number that means nothing.
      - id: fix
        label: Fix with driver-race fixed effect
        weight: 25
        paraphrases:
          - use a fixed effect per driver per race so pit stops reset age but not lap number
          - compare across stints of the same driver in the same race
          - the reset at a pit stop separates fuel from wear
        keywords: [[driver, race, across, pit, reset], [fixed effect, separate, identif, compare]]
        hint: What happens to tyre age and lap number at a pit stop?
        why: Identification comes from variation the model can see.
      - id: evidence
        label: Evidence
        weight: 20
        paraphrases:
          - without fuel control hards seem to improve at {expected.naive_slope_hard} but lose {expected.deg_hard} once fixed
          - the lap number effect is {expected.fuel_slope} seconds per lap
          - most driver races have two or more stints so the fix works
        keywords: [[improve, negative, fuel, lap number, slope, multi, two or more]]
        numeric: {key: deg_hard, tolerance: 0.004}
        hint: Compare the slope with and without a fuel control.
        why: Replace a wrong estimate with the right one.
      - id: oos
        label: Choose and test the break out of sample
        weight: 25
        paraphrases:
          - choosing the break on all the data always improves the fit so test it on held out races
          - leave one race out and compare the break with a straight line
          - pick the break on training races and score it on the held out race
        keywords: [[held out, hold out, leave one, out of sample, unseen, other races, cross], [break, cliff, hinge, line]]
        hint: Where should the break be chosen, and where should it be scored?
        why: In-sample search for a break finds one every time.
    red_flags:
      - id: improve
        critical: true
        penalty: 30
        paraphrases:
          - tyres get faster with age so there is no wear
        feedback: That is fuel burn showing through. Separate it before reading the slope.
      - id: best_fit_cliff
        critical: false
        penalty: 15
        paraphrases:
          - the best fitting break on all the data is the cliff
        feedback: A break chosen in-sample always fits better. It has to win on races it never saw.
      - id: random_split
        critical: false
        penalty: 15
        paraphrases:
          - test the cliff with a random split of laps
        feedback: Laps of one race share track and weather. Hold out whole races.

- id: s13_result
  phase: model
  type: result_explain
  title: Is there a cliff?
  chart: p13_loro
  prompt: >-
    Leave-one-race-out error, straight line vs line with a break: soft {expected.loro_rmse_line_soft} vs
    {expected.loro_rmse_hinge_soft}, medium {expected.loro_rmse_line_medium} vs {expected.loro_rmse_hinge_medium}, hard
    {expected.loro_rmse_line_hard} vs {expected.loro_rmse_hinge_hard} seconds. The break won {expected.loro_wins_hard} of
    {expected.loro_races_hard} held-out races for hards (sign test p {expected.loro_sign_p_hard}). Best in-sample break
    for hards: age {expected.cliff_age_hard}, extra slope {expected.cliff_extra_slope_hard}; using only stints that run
    well past it, the extra slope is {expected.fixedset_extra_slope_hard}. Explain using Claim, Evidence, Reasoning and
    one limitation.
  scaffold: cer
  analysis_pointer: Look at how much the break helps, how often it wins, which way it bends, and whether that survives on the same stints.
  redo_step: Re-read the cliff results, the fixed-set check and the stint survival chart.
  model_answer: >-
    Claim: there is no common-age cliff in the ages teams run. Wear, if anything, slows down with age. Evidence: the break
    lowers held-out error only slightly (hards {expected.loro_rmse_line_hard} to {expected.loro_rmse_hinge_hard} s, a
    {expected.loro_gain_hard} gain), wins {expected.loro_wins_hard} of {expected.loro_races_hard} races, which is not more
    than chance (p {expected.loro_sign_p_hard}), and bends the wrong way: the extra slope after age
    {expected.cliff_age_hard} is {expected.cliff_extra_slope_hard}. Reasoning: a cliff would steepen the curve. The
    flattening could be survivor selection, since teams pit worn tyres first, but it remains when only the same long
    stints are used ({expected.fixedset_extra_slope_hard}), so selection is not the whole story. Tyre management early
    in a planned long stint, a warm-up or graining phase, fuel-saving, or track evolution that isn't linear could all
    produce it, and this data can't tell them apart. Limitation: one break age is shared by all circuits, and the data
    stop where teams pitted, so a cliff at a particular circuit or at older ages is untested, not ruled out.
  rubric:
    points:
      - id: claim
        label: Claim
        weight: 20
        paraphrases:
          - there is no common-age cliff within the ages teams run
          - the break barely helps on unseen races and bends the wrong way for a cliff
          - wear does not accelerate and if anything slows with age
        keywords: [["no", not, isn't, doesn't, barely, slows, flatten], [cliff, break, accelerat, steepen]]
        hint: Did the break help on races it never saw, and which way did it bend?
        why: Start with what it means.
      - id: evidence
        label: Evidence (numbers)
        weight: 25
        paraphrases:
          - held out error falls only from {expected.loro_rmse_line_hard} to {expected.loro_rmse_hinge_hard} seconds for hards
          - the break wins {expected.loro_wins_hard} of {expected.loro_races_hard} races which is not more than chance
          - the extra slope after the break is {expected.cliff_extra_slope_hard} so the curve flattens instead of steepening
        keywords: [[error, RMSE, gain, won, races, chance, extra slope, flatten], [line, break, hinge, held out]]
        numeric: {key: cliff_extra_slope_hard, tolerance: 0.01}
        hint: Quote held-out error for both models and the sign of the extra slope.
        why: The decision rests on the comparison, not on the shape of one curve.
      - id: reasoning
        label: Why it flattens (hypotheses, tested)
        weight: 30
        paraphrases:
          - survivor selection could flatten the tail but it remains on the same long stints so it is not the whole story
          - tyre management early in long stints or a warm-up phase could also flatten the curve
          - the data cannot separate selection from tyre management or fuel saving
        keywords: [[select, survivor, censor, management, manag, warm-up, graining, fuel sav, track evolution], [same stints, fixed, remains, not the whole, cannot tell, hypothes, could]]
        hint: If only the same long stints are used, does the flattening go away?
        why: Testing your own explanation is what separates analysis from storytelling.
      - id: limitation
        label: Limitation
        weight: 25
        paraphrases:
          - not finding a cliff does not prove there is none beyond the ages run
          - one break age for every circuit cannot find a cliff at a particular circuit
          - the data stop where teams pitted so older ages are untested
        keywords: [[not prove, absence, beyond, untested, circuit, shared, common, older]]
        hint: What would you need to see to rule a cliff out completely?
        why: The strategist must not read "no cliff found" as "tyres last forever".
    red_flags:
      - id: forever
        critical: true
        penalty: 30
        paraphrases:
          - there is no cliff so tyres can run as long as you like
        feedback: The data stop where teams pitted. A cliff beyond that, or at one circuit, is untested.
      - id: insample_cliff
        critical: false
        penalty: 15
        paraphrases:
          - the best fitting break proves there is a cliff at that age
        feedback: It was chosen in-sample, barely helped out of sample, and bends the wrong way for a cliff.
      - id: faster_after
        critical: false
        penalty: 15
        paraphrases:
          - the negative extra slope means tyres get faster after the break
        feedback: It means wear slows down after that age (the curve flattens). The tyres are still getting slower.
      - id: survivor_proven
        critical: false
        penalty: 10
        paraphrases:
          - the flattening is proven to be survivor selection
        feedback: The flattening remains on the same long stints, so selection can't be the whole explanation.

- id: s14_numeric
  phase: model
  type: numeric
  title: Read the soft-tyre wear rate
  prompt: After removing the fuel effect, how many seconds per lap of tyre age does the soft compound lose?
  answer_key: deg_soft
  tolerance: 0.005
  unit: s per lap

# ============================================================== DECIDE
- id: s15_threshold
  phase: decide
  type: decision_threshold
  title: Set the stint-length rule
  prompt: >-
    State the rule for the strategist: the trade-off, the formula, the stint length per compound, the plausible range,
    how it compares with what teams actually do, and what the rule leaves out.
  scaffold: threshold
  analysis_pointer: With linear wear s per lap, a stint of L laps loses s times L squared over two. What does splitting it in half save?
  redo_step: Re-read the split-length results and the stint survival chart.
  model_answer: >-
    Trade-off: an extra stop costs the pit loss ({expected.pit_loss} s, middle half of races {expected.pit_loss_q25} to
    {expected.pit_loss_q75} s) and saves wear. With linear wear s per lap, splitting a stint of L laps into two saves
    s times L squared over four, so the extra stop pays when L is longer than twice the square root of pit loss over s.
    Pooled, that is about {expected.split_len_hard} laps on hards, {expected.split_len_medium} on mediums and
    {expected.split_len_soft} on softs. The real range is set by the circuit: using each circuit's own wear and pit loss,
    the hard split length runs from {expected.split_len_hard_circ_min} laps at {expected.split_len_hard_circ_min_at} to
    {expected.split_len_hard_circ_max} at {expected.split_len_hard_circ_max_at} (median {expected.split_len_hard_circ_median}).
    For a median race of {expected.race_laps_median} laps, wear alone justifies {expected.stops_wear_hard} stop, not
    two. In practice the median hard stint ({expected.stint_len_median_hard} laps, counting stints that reach the flag
    as unfinished) is shorter than the split length, yet {expected.km_running_at_split_hard} of hard stints would still
    be running at it. Track position, undercuts, the two-compound rule and an untested cliff also shape stops.
  rubric:
    points:
      - id: tradeoff
        label: Trade-off and pit loss
        weight: 20
        paraphrases:
          - an extra stop costs about {expected.pit_loss} seconds and saves tyre wear
          - weigh the pit loss against the time lost on old tyres
          - fresh tyres are worth it only if they save more than the stop costs
        keywords: [[pit loss, stop, cost], [wear, save, old tyres, fresh]]
        numeric: {key: pit_loss, tolerance: 2}
        hint: What does fresh rubber cost, and what does it buy?
        why: A threshold needs both sides of the trade-off.
      - id: formula
        label: Formula
        weight: 20
        paraphrases:
          - split when the stint is longer than twice the square root of pit loss over wear rate
          - splitting a stint in half saves wear times stint length squared over four
          - the extra stop pays when s L squared over four exceeds the pit loss
        keywords: [[square root, squared, sqrt], [pit loss, wear, half, split]]
        hint: How much wear does halving a stint save?
        why: The number should come from a rule you can re-run with new inputs.
      - id: value
        label: Stint length per compound and its range
        weight: 25
        paraphrases:
          - hards about {expected.split_len_hard} laps mediums {expected.split_len_medium} softs {expected.split_len_soft}
          - by circuit the hard split length runs from {expected.split_len_hard_circ_min} to {expected.split_len_hard_circ_max} laps
          - the range depends mostly on the circuit's wear rate
        keywords: [[laps, stint, length], [hard, medium, soft, circuit, range]]
        numeric: {key: split_len_hard, tolerance: 4}
        hint: Plug in the hard-tyre slope and the pit loss, then do it per circuit.
        why: The strategist needs the number and its real range.
      - id: reality
        label: How many stops wear justifies
        weight: 20
        paraphrases:
          - wear alone justifies one stop in a median race but not a second
          - a race of {expected.race_laps_median} laps on one set is longer than the split length so one stop pays
          - the median hard stint is {expected.stint_len_median_hard} laps which is below the split length
        keywords: [[one stop, single stop, second stop, not two, race], [wear, pays, justif, split]]
        hint: Compare the split length with a full race distance.
        why: A rule that ignores practice should explain how it compares.
      - id: leaves_out
        label: What the rule leaves out
        weight: 15
        paraphrases:
          - track position undercuts and the two compound rule also drive stops
          - an untested cliff beyond the ages run is a risk
          - the rule ignores traffic after the stop
        keywords: [[track position, undercut, rule, two compound, traffic, cliff, risk]]
        hint: Why else do teams stop?
        why: The rule is one input, not the whole strategy.
    red_flags:
      - id: never_stop
        critical: true
        penalty: 30
        paraphrases:
          - never make an extra stop because the wear rule says it does not pay
        feedback: The rule says one stop pays on wear in a normal race. Track position, regulations and cliff risk matter too.
      - id: exact
        critical: false
        penalty: 15
        paraphrases:
          - the tyre will fail at exactly that lap
        feedback: The split length is a trade-off point, not a failure point, and it comes with a range.
      - id: any_slower
        critical: false
        penalty: 15
        paraphrases:
          - stop as soon as the tyres are slower than new ones
        feedback: Every used tyre is slower. The question is whether the time saved beats the pit loss.

- id: s16_memo
  phase: decide
  type: memo
  title: Write the memo to the strategist
  prompt: Recommendation (with a number), evidence (two or three numbers), the risk left over, limitations, next step.
  scaffold: memo
  analysis_pointer: Combine the fuel-corrected wear rates, the cliff test and the split lengths.
  redo_step: Re-read the threshold step.
  model_answer: >-
    Recommendation: plan on linear wear and one stop. An extra stop pays on wear alone only once a stint would pass about
    {expected.split_len_hard} laps on hards, {expected.split_len_medium} on mediums and {expected.split_len_soft} on softs,
    and for hards that ranges by circuit from {expected.split_len_hard_circ_min} to {expected.split_len_hard_circ_max}
    laps. Evidence: fuel-corrected wear is {expected.deg_soft}, {expected.deg_medium} and {expected.deg_hard} s per lap of
    age for softs, mediums and hards; the pit loss is {expected.pit_loss} s; and a break in the curve barely improved
    held-out error and bent the wrong way, so there is no common cliff to plan around. Risk left over: a cliff beyond the
    ages teams run, or at one circuit, is untested; circuit slopes come from two or three races each, so the extremes
    are exaggerated by chance; soft wear moved from {expected.deg_soft_train} in 2023-24 to {expected.deg_soft_test} in
    2025. Limitations: lap number mixes fuel with track evolution; set-up and pressures are not modelled;
    {expected.n_wet_races} wet races are excluded. Next step: re-estimate per circuit from practice long runs, and track
    the 2026 tyres separately.
  rubric:
    points:
      - id: rec
        label: Recommendation with a number
        weight: 25
        paraphrases:
          - an extra stop pays only beyond about {expected.split_len_hard} laps on hards
          - plan stints on linear wear with split lengths of {expected.split_len_hard} {expected.split_len_medium} and {expected.split_len_soft} laps
          - do not add a stop for wear before about {expected.split_len_hard} laps on hards
        keywords: [[stop, stint, split], [laps, hard, medium, soft]]
        numeric: {key: split_len_hard, tolerance: 4}
        hint: Lead with the stint length.
        why: Busy readers read the first line.
      - id: evidence
        label: Evidence
        weight: 25
        paraphrases:
          - wear is {expected.deg_soft} {expected.deg_medium} and {expected.deg_hard} seconds per lap of age after fuel correction
          - the pit loss is {expected.pit_loss} seconds
          - a break barely improved held out error and bent the wrong way
        keywords: [[wear, per lap, pit loss, held out, break, fuel]]
        hint: Two or three numbers.
        why: Numbers make the case.
      - id: risk
        label: Risk left over
        weight: 20
        paraphrases:
          - a cliff beyond the ages run is untested
          - wear differs a lot by circuit
          - circuit slopes rest on few races so the extremes are exaggerated
        keywords: [[cliff, untested, beyond, circuit, varies, differ, risk]]
        hint: What could still go wrong on Sunday?
        why: The downside belongs in the memo.
      - id: limits
        label: Limitations
        weight: 15
        paraphrases:
          - lap number mixes fuel burn with track evolution
          - temperature and set up are not modelled
          - wet races are excluded
        keywords: [[track evolution, fuel, temperature, set-up, setup, wet, observational]]
        hint: Name at least two.
        why: They tell the reader how far to trust it.
      - id: next
        label: Next step
        weight: 15
        paraphrases:
          - re estimate per circuit using practice long runs
          - track the new tyres separately
          - update the slopes before each race
        keywords: [[practice, long run, per circuit, update, re-estimate, new tyres, separately]]
        hint: How will the number stay right?
        why: Good memos end with the next decision.
    red_flags:
      - id: improve
        critical: true
        penalty: 30
        paraphrases:
          - tyres improve with age so stints can be as long as possible
        feedback: That is fuel burn. Fuel-corrected, every compound gets slower with age.
      - id: vague
        critical: false
        penalty: 15
        paraphrases:
          - pit when the tyres feel worn
        feedback: Give the number and the trade-off behind it.
      - id: insample_cliff
        critical: false
        penalty: 15
        paraphrases:
          - pit at the cliff age found in the data
        feedback: No common cliff held up out of sample. Plan on the linear wear rate.

# ============================================================== DEBRIEF
- id: s17_debrief
  phase: debrief
  type: concept_card
  title: What this case taught
  chart: p13_stint_survival
  prompt: Separate what you want from what moves with it, then test the shape out of sample.
  body: >-
    Without a fuel control, hard tyres looked like they improve with age ({expected.naive_slope_hard} s per lap). The
    textbook fix, a stint fixed effect plus lap number, was not identified: inside a stint the two are the same
    variable. A driver-race fixed effect used pit stops to separate them: {expected.deg_hard} s per lap on hards. A break
    chosen in-sample barely helped on unseen races and bent the wrong way, and the flattening survived on the same long
    stints, so selection alone doesn't explain it. The decision is a trade-off with a formula (one stop pays on wear),
    not a cliff to wait for.

debrief:
  concepts_learned:
    - Fuel burn makes laps faster and hides tyre wear
    - A fixed effect can remove the very variation you need (stint FE makes age and lap number identical)
    - Identification comes from events that move one variable but not the other (pit stops)
    - A break chosen in-sample always fits better; choose and score it on different races
    - Censoring - teams stop before tyres get old, and stints end at the flag - shapes what the data can show
    - Test your own explanation (the fixed-set check) instead of assuming it
    - Check judgement-call thresholds (traffic gap, incident rule) with sensitivity runs
    - A decision threshold can come from a simple trade-off formula with a range
  common_mistakes:
    - Reading faster laps as tyres improving
    - Adding lap number to a stint fixed-effect model
    - Reporting the best in-sample break as the cliff
    - Saying a model "never beat" the line when it was slightly better but not reliably
    - Treating "no cliff found" as "no cliff exists"
    - Counting stint laps instead of tyre age
  interview_summary: >-
    Using {expected.n_laps_clean} clean laps from {expected.n_dry_races} dry Formula 1 races (OpenF1, 2023 to 2025), I
    estimated fuel-corrected tyre wear with a driver-race fixed effect, after showing the textbook stint-fixed-effect
    model can't separate fuel from wear. Wear was {expected.deg_soft}, {expected.deg_medium} and {expected.deg_hard} s
    per lap of age on softs, mediums and hards. A tyre cliff did not hold up in leave-one-race-out validation: the
    curve flattens with age instead, even on the same long stints. Weighing wear against a {expected.pit_loss} s pit
    loss, wear alone justifies one stop in a typical race; on hards an extra stop pays only beyond about
    {expected.split_len_hard} laps, from {expected.split_len_hard_circ_min} to {expected.split_len_hard_circ_max} by circuit.
