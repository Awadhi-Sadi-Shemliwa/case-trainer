# P3 · How much US flight delay is passed on from earlier flights, and how much buffer stops it?
id: p3_delay_prop
number: 3
domain: aviation
title: How much flight delay is passed on, and where?
tier: A
decision_maker: Head of network operations at a US airline
decision: Where and by how much should scheduled aircraft turn times be lengthened to stop delays spreading through the day?
money_at_stake: >-
  Every extra minute of scheduled turn time costs aircraft utilisation: fewer flights per aircraft per day. Every minute
  of delay that rolls into the next flight costs crew hours, missed connections and compensation. The buffer has to go
  where it buys the most.
concepts: [delay attribution, proration, reconstructing aircraft rotations, slack and pass-through, non-linear effects,
           sufficient statistics, time-based validation, small denominators, carrier-reported labels]
sources: [bts_delay_cause_stats]
datasets: [bts_ontime_2025_01, bts_ontime_2025_07, bts_ontime_2025_12]
allowed_literals: ["2025", hhmm]

steps:
# ============================================================== BRIEF
- id: s01_brief
  phase: brief
  type: mcq
  title: What is being decided?
  body: >-
    You support the head of network operations at a US airline. A late aircraft arriving at a hub makes its next
    flight late, and that one makes the next. Our data: every flight that the reporting carriers filed with the US
    Bureau of Transportation Statistics in 2025, {expected.n_flights} flights, with scheduled and actual times, delay
    minutes by cause, and the aircraft's tail number.
  prompt: Which decision does this analysis inform?
  options:
    - id: a
      text: Where and how much to lengthen scheduled turn times so delays stop spreading
      correct: true
      explanation: The output is a schedule rule with a place, a time of day and a number of minutes.
    - id: b
      text: Which airline is the best
      explanation: Ranking airlines doesn't change our own schedule.
    - id: c
      text: How to control the weather
      explanation: Nobody can. We decide how much slack absorbs whatever disruption arrives.
    - id: d
      text: Whether to cancel more flights
      explanation: Cancellations are a last resort, and the question is how to keep flights running.

# ============================================================== FRAME
- id: s02_question
  phase: frame
  type: mcq
  title: Frame the question
  prompt: Which question can this data answer AND the airline act on?
  options:
    - id: a
      text: When the same aircraft arrives late, how much of that delay shows up on its next departure, and how does that depend on the scheduled turn time?
      correct: true
      explanation: It follows the mechanism (aircraft rotation) and links it to a lever the airline controls (turn time).
    - id: b
      text: Which delay cause has the biggest share of minutes?
      explanation: Useful context, but cause shares don't tell you what a buffer would fix.
    - id: c
      text: Are flights later in summer?
      explanation: Seasonality is real but isn't a lever.
    - id: d
      text: Do delays cause passenger complaints?
      explanation: There's no complaint data here.

- id: s03_kpis
  phase: frame
  type: kpi_builder
  title: Choose the KPIs
  prompt: Select every KPI that helps decide where turn buffers should go.
  options:
    - id: la_share
      text: Share of delay minutes coded as late-arriving aircraft
      correct: true
      explanation: The size of the propagation problem as carriers report it.
    - id: pass
      text: Share of an inbound delay that passes to the same aircraft's next departure, by scheduled turn time
      correct: true
      explanation: This directly measures what a longer turn buys.
    - id: hub_hour
      text: Late-aircraft minutes per departure by airport and hour of day
      correct: true
      explanation: It shows WHERE the buffer is needed.
    - id: mean_delay_all
      text: Average arrival delay of all flights including early ones
      explanation: Early arrivals cancel late ones in an average, which hides the problem.
    - id: cancel_count
      text: Number of cancelled flights per airline
      explanation: Cancellations drop out of delay data entirely, so this measures something else.

# ============================================================== PREDICT
- id: s04_predict_data
  phase: predict
  type: data_expectation
  title: Predict the file before you load it
  dataset: bts_ontime_2025_01
  prompt: >-
    Before you look: describe one monthly BTS on-time file. One row = ? How are times written? Which flights will have
    missing delay values, and which will have delay-cause minutes? How would you find "the same aircraft's next flight"?
  scaffold: predict_data
  analysis_pointer: Think about what a cancelled flight's arrival delay could possibly be.
  redo_step: Read the real schema and the clean log.
  model_answer: >-
    One row per scheduled flight, with date, airline, tail number, origin and destination, and scheduled and actual times
    written as local hhmm numbers. Delays are in minutes, negative when early. Cancelled and diverted flights have no
    arrival delay. Cause minutes (carrier, weather, NAS, security, late aircraft) exist only for flights arriving at
    least fifteen minutes late, and BTS prorates them by minutes. To find the next flight of the same aircraft, sort
    by tail number and scheduled time and match the arrival airport to the next origin. Traps: local times in
    different time zones, midnight crossings, missing tail numbers, and a file of over a hundred columns.
  rubric:
    points:
      - id: grain
        label: Grain and key columns
        weight: 20
        paraphrases:
          - one row per scheduled flight with times delays and tail number
          - each row is a flight leg with origin destination and delay minutes
          - flight level file with scheduled and actual times
        keywords: [[flight, leg, row], [tail, origin, destination, scheduled, delay]]
        hint: What is the natural unit of an on-time report?
        why: Grain decides how you reconstruct rotations.
      - id: times
        label: Time format
        weight: 20
        paraphrases:
          - times are local hhmm numbers not timestamps
          - times are in each airport's local time zone
          - midnight crossings need care
        keywords: [[hhmm, local, time zone, midnight, clock]]
        hint: Is a departure at Boston and an arrival in Denver on the same clock?
        why: Mixing time zones silently creates wrong turn times.
      - id: missing
        label: Which values are missing
        weight: 30
        paraphrases:
          - cancelled and diverted flights have no arrival delay
          - cause minutes exist only for flights at least fifteen minutes late
          - on time flights have blank cause fields
        keywords: [[cancel, divert, blank, missing, empty], [cause, fifteen, late, delayed]]
        hint: Which flights never arrived as planned, and which flights need a cause?
        why: Missing by design is not missing at random.
      - id: rotation
        label: Linking aircraft
        weight: 30
        paraphrases:
          - sort by tail number and time and match the arrival airport to the next origin
          - the tail number lets you follow one aircraft through the day
          - the next flight of the same aircraft must depart from the airport where it landed
        keywords: [[tail, aircraft, same plane], [next, sort, follow, rotation, match]]
        hint: What identifies a physical aircraft in this file?
        why: Propagation lives in the aircraft's chain of flights.
    red_flags:
      - id: cancel_zero
        critical: false
        penalty: 15
        paraphrases:
          - cancelled flights have a delay of zero
        feedback: Cancelled flights have no delay at all. Zero would make the worst disruptions look punctual.
      - id: utc
        critical: false
        penalty: 10
        paraphrases:
          - all times are in UTC
        feedback: BTS writes local hhmm times.
      - id: causes_all
        critical: false
        penalty: 10
        paraphrases:
          - every flight has delay cause minutes
        feedback: Causes are reported only for flights at least fifteen minutes late.

# ============================================================== DATA
- id: s05_read_rotations
  phase: data
  type: code_read
  title: Read how rotations are rebuilt
  snippet: {file: clean.py, name: build_rotations}
  prompt: >-
    This is the real code that follows each aircraft. Find the lines that make sure the next flight leaves from the
    airport where the aircraft landed, and that drop overnight arrivals.

- id: s06_fill_hhmm
  phase: data
  type: code_fill
  title: Convert hhmm to minutes
  snippet: {file: clean.py, name: hhmm}
  prompt: BTS writes a clock time such as twenty-five to three in the afternoon as the number fourteen thirty-five. Fill the blank that turns it into minutes after midnight.
  blanks:
    - token: "(x // 100) * 60 + (x % 100)"
      accept: ["x // 100 * 60 + x % 100", "(x//100)*60 + x%100"]

- id: s07_justify_turns
  phase: data
  type: cleaning_justification
  title: Justify the turn-time window
  transform: rotation_turn_window
  prompt: >-
    The pipeline kept only aircraft turns with a scheduled ground time inside a fixed window, and dropped the rest.
    Justify it: what was done, why, the alternative you rejected, and what would break if you skipped it.
  scaffold: justify_clean
  analysis_pointer: Think about what a three-hour or overnight sit at the gate means for "propagation".
  redo_step: Look at the logged counts for the turn window and the delay range.
  model_answer: >-
    Pairs of consecutive flights by the same aircraft were kept only when the scheduled turn was within a normal range;
    very short gaps and very long sits were dropped, with the count logged. A gap shorter than any realistic minimum
    turn is a data error. A long sit means the aircraft was parked for hours, so lateness is reset and there is nothing to
    propagate. I rejected keeping everything, because those pairs would drag the pass-through towards zero and make
    buffers look more powerful than they are. I also rejected a narrow window, which would hide how pass-through falls
    as turns get longer. If I skipped the step, the propagation curve would mix real turns with overnight parking and
    the buffer rule would be wrong.
  rubric:
    points:
      - id: what
        label: What was done
        weight: 20
        paraphrases:
          - turns outside a normal scheduled ground time were dropped and counted
          - only consecutive flights of the same aircraft with a normal turn were kept
          - very short and very long gaps were removed
        keywords: [[turn, gap, ground time, window], [drop, remove, keep, exclude]]
        hint: Which pairs survived?
        why: A cleaning step starts with a plain description.
      - id: why_long
        label: Why long sits go
        weight: 25
        paraphrases:
          - a long sit at the gate resets lateness so it is not propagation
          - an aircraft parked for hours has plenty of slack
          - overnight or long gaps are not turns
        keywords: [[long, parked, hours, overnight, reset, slack], [not, propagation, turn]]
        hint: Can a three-hour sit pass a one-hour delay on?
        why: The population must match the mechanism.
      - id: why_short
        label: Why very short gaps go
        weight: 20
        paraphrases:
          - very short gaps are data errors
          - a turn shorter than any real minimum turn is not physically possible
          - impossible ground times signal bad records
        keywords: [[short, error, through, impossible, minimum]]
        hint: Can a narrow-body aircraft really turn in a few minutes?
        why: Impossible values are errors, not observations.
      - id: consequence
        label: What breaks if skipped
        weight: 35
        paraphrases:
          - keeping long sits would pull pass-through toward zero and overstate buffers
          - the propagation curve would mix real turns with parking
          - the buffer rule would recommend the wrong number of minutes
        keywords: [[overstate, bias, pull, mix, wrong], [buffer, pass, propagation, curve, rule]]
        hint: How would including parked aircraft change the curve?
        why: Cleaning matters through its effect on the decision.
    red_flags:
      - id: outliers
        critical: false
        penalty: 15
        paraphrases:
          - long turns were removed because they are outliers
        feedback: They aren't statistical outliers. They're a different mechanism (parking, not turning).
      - id: silent
        critical: false
        penalty: 15
        paraphrases:
          - drop them without recording how many
        feedback: Every drop needs a logged count and reason.
      - id: helps_result
        critical: true
        penalty: 30
        paraphrases:
          - we removed them because the result looked better
        feedback: Never justify a filter by its effect on the result. Justify it by the mechanism.

# ============================================================== EXPLORE
- id: s08_cause_card
  phase: explore
  type: concept_card
  title: What delay minutes are coded as
  chart: p3_cause_share_by_month
  prompt: Carriers label each delayed flight's minutes by cause, and BTS prorates them by minutes.
  body: >-
    In {expected.analysis_year_label} the largest share of delay minutes was coded late-arriving aircraft
    ({expected.share_lateaircraft}), then air carrier ({expected.share_carrier}), National Aviation System
    ({expected.share_nas}) and extreme weather ({expected.share_weather}). Labels are carrier-reported categories, not
    measured causes: "late-arriving aircraft" says WHERE the delay came from (the previous flight), not what started
    it. The late-aircraft share ranged from {expected.la_share_min} in {expected.la_share_min_month} to
    {expected.la_share_max} in {expected.la_share_max_month}. Real output: {captured.cause_shares}

- id: s09_chart_heatmap
  phase: explore
  type: chart_explain
  title: Read the airport-by-hour heatmap
  chart: p3_hub_hour_heatmap
  prompt: Explain what this chart shows and what it does NOT show.
  scaffold: chart_6q
  analysis_pointer: Read each row left to right, then ask why the first column is nearly empty and which cells are blank.
  redo_step: Compare morning and evening values, and look at the masked cells and the raw extreme cell.
  model_answer: >-
    Each row is one of the {expected.n_top_hubs} busiest airports and each column a scheduled departure hour; colour is
    late-aircraft delay minutes per departure, and cells with fewer than {expected.min_cell_deps} departures are blank.
    Late-aircraft delay rises through the day, from {expected.la_morning} minutes per departure in the morning to
    {expected.la_evening} in the evening, about {expected.la_evening_ratio} times higher. Part of that is mechanical:
    the first wave of the day uses aircraft that sat overnight, so they can hardly be late from a previous flight.
    Afternoon disruption such as storms adds to it. The worst evenings are at {expected.evening_worst_airport} and
    {expected.evening_second_airport}. Anomaly: without the mask, the most extreme cell ({expected.worst_cell_airport}
    at hour {expected.worst_cell_hour}) rests on only {expected.worst_cell_deps} departures, against a median of
    {expected.hub_median_cell_deps}. Night hours are not shown. It can't show what started the delay, because late
    aircraft is a downstream label. So what: look at afternoon and evening turns at the worst airports first.
  rubric:
    points:
      - id: axes
        label: What is plotted
        weight: 15
        paraphrases:
          - rows are busy airports columns are scheduled departure hours and colour is late aircraft minutes per departure
          - the heatmap shows late aircraft delay per departure by airport and hour
          - blank cells have too few departures to show
        keywords: [[airport, hub, row], [hour, column, time of day], [colour, color, minutes, per departure, blank]]
        hint: Name rows, columns, colour and the blank cells.
        why: A heatmap you can't read is decoration.
      - id: buildup
        label: Build-up and why
        weight: 25
        paraphrases:
          - late aircraft delay rises from morning to evening
          - early flights use aircraft that sat overnight so they cannot carry delay from a previous flight
          - delay accumulates during the day as earlier disruption feeds later flights
        keywords: [[rise, build, accumulate, increase], [overnight, first wave, morning, mechanical, earlier]]
        hint: Why is the first column nearly empty?
        why: Separating the mechanical part from real propagation stops you over-reading the ratio.
      - id: size
        label: Size (a number)
        weight: 20
        paraphrases:
          - evening late aircraft minutes per departure are about {expected.la_evening_ratio} times the morning level
          - from {expected.la_morning} to {expected.la_evening} minutes per departure
          - the worst evenings are at {expected.evening_worst_airport}
        keywords: [[times, ratio, from, minutes per departure, worst]]
        numeric: {key: la_evening_ratio, tolerance: 0.6}
        hint: Quote the morning and evening averages.
        why: The size tells you whether a buffer is worth its cost.
      - id: small_n
        label: Small-denominator trap
        weight: 20
        paraphrases:
          - the most extreme raw cell has very few departures so it is noise
          - cells with few departures are masked because rates from small samples mislead
          - a rate from a handful of flights is unreliable
        keywords: [[few, small, sample, noisy, denominator, departures, mask, blank]]
        hint: How many departures sit behind the most extreme cell?
        why: The most dramatic colours often come from the smallest samples.
      - id: limits
        label: What it can't show
        weight: 10
        paraphrases:
          - late aircraft is a downstream label not the original cause
          - the chart does not show what started the delay
          - carrier coded categories are not measured causes
        keywords: [[label, downstream, original, root, started, carrier, coded]]
        hint: If a delay is labelled late aircraft, where did it begin?
        why: Labels describe accounting, not mechanisms.
      - id: so_what
        label: So what
        weight: 10
        paraphrases:
          - look at afternoon and evening turns at the worst airports first
          - add slack where delay accumulates not everywhere
          - focus schedule changes on the late part of the day
        keywords: [[target, focus, buffer, slack, look], [evening, afternoon, worst, where]]
        hint: Where would one extra minute buy most?
        why: Charts exist to direct scarce resources.
    red_flags:
      - id: worst_cell_real
        critical: false
        penalty: 15
        paraphrases:
          - the single most extreme cell is clearly the biggest problem in the network
        feedback: That cell rests on very few departures. Check the denominator before acting on a colour.
      - id: weather_most
        critical: false
        penalty: 15
        paraphrases:
          - weather causes most delays
        feedback: In the coded data extreme weather is a small share. How weather spreads across categories is a definition question; don't guess.
      - id: all_propagation
        critical: false
        penalty: 10
        paraphrases:
          - the whole morning to evening increase is propagation
        feedback: Part of it is mechanical, since first-wave aircraft sat overnight. Name that before using the ratio.

# ============================================================== MODEL
- id: s10_method
  phase: model
  type: mcq
  title: Choose the measurement
  prompt: Which measurement best tells the airline what a longer turn buys?
  options:
    - id: a
      text: For the same aircraft, the share of a one-hour-late arrival that shows up as departure delay on its next flight, by scheduled turn band
      correct: true
      explanation: >-
        It follows the physical chain and measures the lever directly. The linear slope alone can mislead, because a turn
        absorbs delay up to its slack and passes the rest on almost minute for minute.
    - id: b
      text: Correlation between average departure delay and average arrival delay per airport
      explanation: Airport averages mix different aircraft and say nothing about turn time.
    - id: c
      text: The share of minutes coded late-arriving aircraft
      explanation: That sizes the problem but doesn't say what a buffer would change.
    - id: d
      text: A classifier predicting which flights are delayed
      explanation: Prediction doesn't answer "how much does an extra ten minutes absorb?".

- id: s11_read_suff
  phase: model
  type: code_read
  title: Exact regression from sums
  snippet: {file: analyse.py, name: ols_from_sums}
  prompt: >-
    The pipeline never ships millions of flight pairs. It stores counts, sums and cross-products per group, and this
    code rebuilds the exact least-squares slope from them. Why is this as exact as fitting on the raw pairs?

- id: s12_plan_challenge
  phase: model
  type: plan_challenge
  title: Attack this plan
  flawed_plan: >-
    "Late-arriving aircraft is the biggest cause, so I'll tell the airline to add thirty minutes to every turn in the
    network. To prove it works I'll show that flights with longer turns have lower average delay across all
    flights, early ones included. The worst cell on the heatmap gets the biggest buffer."
  prompt: >-
    Challenge this plan: what does each part assume, why does that fail here, how would you fix it, and how would you
    check the fix?
  scaffold: challenge_plan
  analysis_pointer: Think about cost, who flies long and short turns, what an average over all flights hides, and the denominator behind a heatmap cell.
  redo_step: Look at the propagation table (excess and carrier-weighted columns) and the masked heatmap.
  model_answer: >-
    First, "late-arriving aircraft" says where delay came from, not what started it, and a blanket buffer ignores cost:
    every added minute reduces aircraft utilisation. Second, comparing average delay of all flights by turn length is
    confounded. Short turns are mostly certain business models ({expected.top_carrier_short} flies
    {expected.top_carrier_short_share} of the shortest band), long turns sit at different airports and times, and
    averaging in early flights hides propagation. Better: on the same aircraft, measure how much EXTRA inbound delay
    passes on, compared within each airline. Excess pass-through falls from {expected.pass_cw_b1} for the shortest
    turns to {expected.pass_cw_b5} for turns of {expected.band_b5} minutes. Third, the most extreme heatmap cell rests on
    {expected.worst_cell_deps} departures, so it's noise. Check the fix out of time: the rule chosen on Jan-Sep
    should still meet the target on Oct-Dec.
  rubric:
    points:
      - id: cost_target
        label: Blanket buffer ignores cost and targeting
        weight: 25
        paraphrases:
          - adding time to every turn is expensive because it cuts aircraft utilisation
          - buffers should go where delay accumulates not everywhere
          - target evening turns at the worst airports
        keywords: [[cost, utilisation, utilization, expensive, every turn, blanket], [target, where, evening, worst]]
        hint: What does an extra minute of turn cost the airline?
        why: A decision without cost is not a decision.
      - id: confound
        label: Confounded comparison
        weight: 25
        paraphrases:
          - short and long turns are flown by different airlines and at different airports and times
          - averaging delay over all flights including early ones hides propagation
          - compare within each airline on the same aircraft rather than across all flights
        keywords: [[airline, carrier, business model, airport, time, confound, average, early], [within, same aircraft, compare]]
        hint: Who flies forty-minute turns, and who parks aircraft for two hours?
        why: Without holding the airline mix fixed you compare business models, not turn lengths.
      - id: evidence
        label: Correct evidence
        weight: 25
        paraphrases:
          - excess pass-through falls from {expected.pass_cw_b1} at short turns to {expected.pass_cw_b5} at longer turns within airlines
          - longer scheduled turns absorb more of the extra inbound delay
          - measure the extra delay passed on, not the raw delay
        keywords: [[pass, share, absorb, extra, excess], [turn, band, longer, shorter]]
        numeric: {key: pass_cw_b5, tolerance: 0.05, accept_percent: true}
        hint: What does the carrier-weighted column of the propagation table show?
        why: Replace a wrong proof with the right one.
      - id: small_cell
        label: Worst cell is noise
        weight: 25
        paraphrases:
          - the most extreme cell rests on very few departures
          - check the denominator before acting on a heatmap colour
          - a rate from a small sample is unreliable
        keywords: [[few, small, sample, denominator, departures, noise, mask]]
        hint: How many flights are behind that cell?
        why: The most extreme colours often come from the smallest samples.
    red_flags:
      - id: blanket_ok
        critical: true
        penalty: 30
        paraphrases:
          - adding thirty minutes to every turn is the right fix
        feedback: Ignoring cost and targeting is not a recommendation an airline can use.
      - id: weather_most
        critical: false
        penalty: 15
        paraphrases:
          - weather causes most delays so buffers will not help
        feedback: Extreme weather is a small coded share, and buffers absorb delay whatever started it.
      - id: la_root
        critical: false
        penalty: 15
        paraphrases:
          - late aircraft is the root cause so fixing turns fixes delays
        feedback: Buffers stop propagation; they don't remove the delay that started the chain.

- id: s13_result
  phase: model
  type: result_explain
  title: Interpret the propagation results
  chart: p3_propagation_by_turn
  prompt: >-
    Raw pass-through of a one-hour-late arrival for the shortest turns: {expected.pass_raw_b1}. Excess pass-through
    (baseline removed) by band, shortest to longest: {expected.pass_b1}, {expected.pass_b2}, {expected.pass_b3},
    {expected.pass_b4}, {expected.pass_b5}, {expected.pass_b6}. Explain what this means using Claim, Evidence, Reasoning
    and one limitation. {captured.propagation_table}
  scaffold: cer
  analysis_pointer: Compare the raw and excess columns for the shortest band, then compare the pooled, carrier-weighted and clean-day columns.
  redo_step: Re-read the propagation table column by column.
  model_answer: >-
    Claim: on short turns almost every extra minute of inbound delay is passed on, and pass-through only falls once the
    scheduled turn leaves real slack. Evidence: the raw figure for the shortest turns ({expected.pass_raw_b1}) looks like
    amplification, but it includes the delay those departures have anyway ({expected.base_out_b1} minutes even after
    an on-time arrival). The excess pass-through is {expected.pass_b1}: one for one, not amplified. It falls to
    {expected.pass_b5} for turns of {expected.band_b5} minutes and {expected.pass_b6} for the longest. Comparing within
    airlines gives almost the same curve ({expected.pass_cw_b1} to {expected.pass_cw_b5}), and so do days without
    cancellations ({expected.pass_clean_b5}), so airline mix and aircraft swaps don't drive it. Reasoning: a turn
    absorbs delay up to its slack above the minimum turn, and the rest passes on. Limitation: observational. Turn
    lengths are chosen by schedulers, common shocks such as ground stops hit both legs, crews connect separately from
    aircraft, and the curve moved between Jan-Sep and Oct-Dec (up to {expected.max_pass_shift}).
  rubric:
    points:
      - id: claim
        label: Claim
        weight: 15
        paraphrases:
          - short turns pass on almost all extra inbound delay and longer turns absorb it
          - buffers only work once the turn leaves real slack
          - pass-through falls as scheduled turn time grows
        keywords: [[short, long, turn, buffer, slack], [pass, absorb, propagate]]
        hint: One sentence about how turn time changes propagation.
        why: Start with what it means.
      - id: raw_vs_excess
        label: Raw over one hundred percent is a baseline artefact
        weight: 25
        paraphrases:
          - the raw pass-through above one hundred percent includes the baseline delay those departures have anyway
          - after removing the baseline the shortest turns pass on about one for one not more
          - it is not amplification once the delay after an on-time arrival is subtracted
        keywords: [[baseline, anyway, on time, subtract, remove, excess], [not amplif, one for one, artefact, artifact]]
        hint: How late do these departures leave even when the inbound was on time?
        why: Mistaking a baseline for an effect is a classic analysis error.
      - id: evidence
        label: Evidence (numbers)
        weight: 20
        paraphrases:
          - excess pass-through falls from {expected.pass_b1} to {expected.pass_b5} at {expected.band_b5} minute turns
          - the longest turns pass on only {expected.pass_b6}
          - the carrier weighted curve gives {expected.pass_cw_b5} for the same band
        keywords: [[pass, share, excess], [shortest, longest, band, turn]]
        numeric: {key: pass_b5, tolerance: 0.05, accept_percent: true}
        hint: Quote the excess pass-through at short and long turns.
        why: The size of the effect justifies the buffer.
      - id: robustness
        label: Robustness checks
        weight: 20
        paraphrases:
          - comparing within airlines gives almost the same curve so airline mix does not drive it
          - days without cancellations give the same curve so aircraft swaps do not drive it
          - the curve moved between the two periods so the threshold is uncertain
        keywords: [[within, airline, carrier, cancellation, swap, period, moved, shift], [same, similar, uncertain]]
        hint: What do the carrier-weighted and clean-day columns tell you?
        why: Checks that could have broken the result are what make it credible.
      - id: limitation
        label: Limitation
        weight: 20
        paraphrases:
          - this is observational because schedulers choose turn lengths
          - common shocks like ground stops delay both legs at once
          - crews connect separately from aircraft
        keywords: [[observational, scheduler, chosen, common shock, ground stop, weather, crew, confound]]
        hint: What else links the inbound and outbound delay?
        why: The airline should know how far to trust the curve.
    red_flags:
      - id: amplify_claim
        critical: false
        penalty: 20
        paraphrases:
          - short turns amplify delays by more than the inbound delay
        feedback: The raw figure includes baseline delay. Excess pass-through on short turns is about one for one.
      - id: causal_certain
        critical: true
        penalty: 30
        paraphrases:
          - lengthening every turn to the longest band is guaranteed to remove most delay
        feedback: The curve is observational and ignores cost. Recommend targeted, tested buffers.
      - id: weather_most
        critical: false
        penalty: 15
        paraphrases:
          - weather causes most delays
        feedback: Extreme weather is a small coded share in this data.

- id: s14_numeric
  phase: model
  type: numeric
  title: Read the evening build-up
  prompt: At the busiest airports, how many times higher is late-aircraft delay per departure in the evening than in the morning?
  answer_key: la_evening_ratio
  tolerance: 0.2
  unit: times

# ============================================================== DECIDE
- id: s15_threshold
  phase: decide
  type: decision_threshold
  title: Set the buffer rule
  prompt: >-
    State the rule for the schedule planners: the metric, the target, the minimum turn, where to apply it, what to
    expect, and what the out-of-time check says. Then say how you would test it before rolling it out.
  scaffold: threshold
  analysis_pointer: Use the turn where the Jan-Sep curve crosses the target, then the Oct-Dec check.
  redo_step: Re-read the buffer rule results and the hub-hour heatmap.
  model_answer: >-
    Metric: the share of a one-hour-late arrival's EXTRA delay passed to the same aircraft's next departure, compared
    within airlines. Target: less than {expected.pass_target}. On Jan-Sep the curve crosses the target at about
    {expected.buffer_turn_exact} minutes, so the rule is a minimum turn of {expected.buffer_min_turn} minutes. The
    out-of-time check does not fully hold: on Oct-Dec the crossing is at {expected.buffer_turn_octdec} minutes and
    the rule passes on {expected.buffer_pass_octdec}. So treat {expected.buffer_min_turn} to
    {expected.buffer_turn_octdec} minutes as the range to test. Where: afternoon and evening turns at the airports where
    delay accumulates, such as {expected.evening_worst_airport}, not network-wide. Every added minute costs
    utilisation, and each added minute saves only about {expected.saving_per_added_minute} minutes of delay after a
    one-hour-late arrival. Test: a pilot on a few evening banks against similar control banks.
  rubric:
    points:
      - id: metric
        label: Metric and target
        weight: 15
        paraphrases:
          - the share of extra inbound delay passed to the next departure kept below {expected.pass_target}
          - excess pass through compared within airlines
          - less than half of the extra delay should pass on
        keywords: [[pass, share, extra, excess, propagat], [target, below, less than, half]]
        hint: Which number does the rule control?
        why: A rule needs one metric and one target.
      - id: value
        label: Minimum turn and range
        weight: 25
        paraphrases:
          - a minimum scheduled turn of {expected.buffer_min_turn} minutes on targeted turns
          - test a range from {expected.buffer_min_turn} to {expected.buffer_turn_octdec} minutes
          - the curve crosses the target at about {expected.buffer_turn_exact} minutes
        keywords: [[minimum, at least, range, schedule, crosses], [turn, minutes]]
        numeric: {key: buffer_min_turn, tolerance: 5}
        hint: Where does the Jan-Sep curve cross the target?
        why: Planners need the number and its uncertainty.
      - id: oot_check
        label: Out-of-time check
        weight: 20
        paraphrases:
          - on Oct-Dec the rule did not fully meet the target
          - the later months need a longer turn so the threshold is uncertain
          - the curve shifted between the two periods
        keywords: [[Oct, later, out of time, check], [not, shift, longer, uncertain, did not hold]]
        hint: Does the rule still meet the target on the months it never saw?
        why: An honest rule reports its own failure modes.
      - id: where_cost
        label: Where, and the cost
        weight: 20
        paraphrases:
          - apply it to evening turns at the worst airports not network wide
          - each added minute saves only about {expected.saving_per_added_minute} minutes of delay so cost matters
          - target where delay accumulates because extra minutes cost utilisation
        keywords: [[evening, afternoon, worst, where, target], [cost, utilisation, utilization, per minute, not everywhere]]
        hint: What does one added minute buy?
        why: Targeting is what makes the buffer affordable.
      - id: test
        label: Pilot test
        weight: 20
        paraphrases:
          - pilot it on a few banks against control banks before rolling out
          - the curve is observational so test the rule
          - measure the effect on piloted banks against similar banks
        keywords: [[pilot, test, control, trial, measure]]
        hint: How will you know it worked?
        why: Observational evidence earns a trial, not a full rollout.
    red_flags:
      - id: everywhere
        critical: true
        penalty: 30
        paraphrases:
          - apply the longer turn to every flight in the network
        feedback: That ignores cost. Target where propagation accumulates.
      - id: guaranteed
        critical: false
        penalty: 15
        paraphrases:
          - the rule will definitely cut delay by exactly that amount
        feedback: The curve is observational and moved between periods. Give a range and test it.
      - id: worst_cell_only
        critical: false
        penalty: 15
        paraphrases:
          - put all the buffer into the single most extreme heatmap cell
        feedback: That cell has very few departures. Use the broad evening pattern.

- id: s16_memo
  phase: decide
  type: memo
  title: Write the memo to network operations
  prompt: Recommendation (with a number), evidence (two or three numbers), the risk left over, limitations, next step.
  scaffold: memo
  analysis_pointer: Combine the cause shares, the heatmap and the excess pass-through curve.
  redo_step: Re-read the threshold step.
  model_answer: >-
    Recommendation: pilot a minimum scheduled turn of {expected.buffer_min_turn} to {expected.buffer_turn_octdec} minutes
    on tight afternoon and evening turns at the airports where delay accumulates, starting with
    {expected.evening_worst_airport}. Evidence: late-arriving aircraft is the largest coded share of delay minutes
    ({expected.share_lateaircraft}); at the busiest airports late-aircraft delay per departure is
    {expected.la_evening_ratio} times higher in the evening (partly because first-wave aircraft sat overnight); and,
    within airlines, short turns pass on {expected.pass_cw_b1} of the extra delay against {expected.pass_cw_b5} for turns of
    {expected.band_b5} minutes. Risk left over: each added minute costs utilisation and saves only about
    {expected.saving_per_added_minute} minutes after a one-hour-late arrival. The threshold moved between periods, and
    buffers don't remove the delays that start the chains. Limitations: cause codes are carrier labels; the curve is
    observational (common shocks, crew connections); cancelled flights drop out. Next step: a controlled pilot on
    selected banks, measured against similar banks.
  rubric:
    points:
      - id: rec
        label: Recommendation with a number
        weight: 25
        paraphrases:
          - pilot a minimum turn of {expected.buffer_min_turn} to {expected.buffer_turn_octdec} minutes on targeted evening turns
          - add buffer where delay accumulates with a minimum turn of about {expected.buffer_min_turn} minutes
          - pilot longer turns on the worst evening banks
        keywords: [[lengthen, buffer, minimum, pilot], [turn, minutes, evening]]
        numeric: {key: buffer_min_turn, tolerance: 5}
        hint: Lead with the action, the number and where.
        why: Busy readers read the first line.
      - id: evidence
        label: Evidence
        weight: 25
        paraphrases:
          - late arriving aircraft is {expected.share_lateaircraft} of delay minutes
          - evening late aircraft delay is {expected.la_evening_ratio} times the morning level
          - within airlines short turns pass on {expected.pass_cw_b1} of the extra delay against {expected.pass_cw_b5}
        keywords: [[late aircraft, share, evening, pass, times, within]]
        hint: Two or three numbers.
        why: Numbers make the case.
      - id: risk
        label: Risk left over
        weight: 20
        paraphrases:
          - extra minutes cost aircraft utilisation and buy only part of a minute each
          - the threshold moved between periods
          - buffers do not remove the delays that start the chain
        keywords: [[cost, utilisation, utilization, moved, shift, start, original, risk]]
        hint: What could still go wrong?
        why: The downside belongs in the memo.
      - id: limits
        label: Limitations
        weight: 15
        paraphrases:
          - cause codes are carrier reported labels
          - the curve is observational with common shocks and crew connections
          - cancelled flights drop out of the delay data
        keywords: [[label, carrier, observational, shock, crew, cancel]]
        hint: Name at least two.
        why: They tell the reader how far to trust it.
      - id: next
        label: Next step
        weight: 15
        paraphrases:
          - run a controlled pilot on selected banks
          - compare piloted banks with similar control banks
          - measure the effect before network rollout
        keywords: [[pilot, control, trial, measure, test]]
        hint: How will you know it worked?
        why: Good memos end with the next decision.
    red_flags:
      - id: everywhere
        critical: true
        penalty: 30
        paraphrases:
          - add thirty minutes to every turn in the network
        feedback: Blanket buffers ignore cost.
      - id: weather
        critical: false
        penalty: 15
        paraphrases:
          - weather causes most delays so nothing can be done
        feedback: Extreme weather is a small coded share, and buffers absorb delay whatever starts it.
      - id: vague
        critical: false
        penalty: 15
        paraphrases:
          - add some buffer where it seems useful
        feedback: Give the number and the place.

# ============================================================== DEBRIEF
- id: s17_debrief
  phase: debrief
  type: concept_card
  title: What this case taught
  prompt: Follow the mechanism, remove the baseline, hold the mix fixed, and check the denominator.
  body: >-
    Cause labels told us late aircraft is big ({expected.share_lateaircraft}) but not what to do. Rebuilding
    {expected.n_pairs} aircraft turns showed the lever, but only after removing the baseline: the raw
    {expected.pass_raw_b1} on short turns became {expected.pass_b1}, one for one. Comparing within airlines and on days
    without cancellations left the curve unchanged. The threshold moved out of time, so the decision is a tested range,
    not a single number. And the most dramatic heatmap colour came from {expected.worst_cell_deps} flights.

debrief:
  concepts_learned:
    - Cause codes are carrier labels; late aircraft says where delay came from, not what started it
    - Rebuild the mechanism (aircraft rotations) to measure the lever directly
    - Subtract the baseline before calling anything amplification
    - Compare within airlines so the comparison is not between business models
    - Turns absorb delay up to their slack; the effect is non-linear
    - Rates from small denominators produce the most extreme and least reliable values
    - Sufficient statistics give exact regressions without shipping raw data
  common_mistakes:
    - Saying weather causes most delays
    - Recommending a buffer on every turn without cost
    - Averaging delay over all flights, early ones included
    - Acting on a heatmap cell without checking its denominator
    - Reading a raw ratio above one as amplification
  interview_summary: >-
    Using all {expected.n_flights} US domestic flights from {expected.analysis_year_label}, I rebuilt {expected.n_pairs}
    aircraft turns from tail numbers to measure delay propagation directly. After removing baseline delay and comparing
    within airlines, short turns passed on {expected.pass_cw_b1} of the extra delay and turns of {expected.band_b5}
    minutes {expected.pass_cw_b5}. The threshold moved between Jan-Sep and Oct-Dec, so I recommended piloting a
    {expected.buffer_min_turn}-to-{expected.buffer_turn_octdec}-minute minimum turn on evening banks at the worst
    airports, rather than a network-wide buffer.
