step: s12_chart_spread
answers:
- id: a01
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    The chart shows the monthly 2s10s and 10y-3m Treasury spreads in percentage points since the seventies,
    with NBER recessions shaded. Before almost every recession the spread goes negative, and during
    recessions it jumps back up. The median lead for 2s10s is {expected.median_lead_months} months, ranging
    from {expected.min_lead_months} to {expected.max_lead_months}. There are false alarms, including the long
    recent inversion with no recession so far, and 2s10s missed the pandemic recession. It shows timing, not
    causation, and there are few recessions. For the PM, inversion is an early warning, not a sell-today signal.
- id: a02
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    Plotted: two yield spreads (10y minus 2y and 10y minus 3m) in percentage points over time; grey bars are
    recession months. Pattern: the curve inverts ahead of recessions. Strength:
    {expected.recessions_signalled_2s10s} of {expected.recessions_evaluable_2s10s} recessions were preceded by a
    2s10s inversion, median lead about {expected.median_lead_months} months. Anomalies: false alarms
    (recent long inversion) and a miss in the pandemic. Cannot show: causation, and it could be chance with
    so few events. So what: treat inversion as raising risk over the next year or two.
- id: a03
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    The lines are yield spreads (long minus short Treasury rates) and the shaded areas are NBER recessions.
    The spread tends to fall below zero roughly {expected.median_lead_months} months before a recession
    starts, then rises sharply during the recession. But not every inversion was followed by a recession;
    the latest one so far was a false alarm. The chart shows association and timing, not cause, since tight
    monetary policy could drive both. For the PM it is a warning to prepare, not an immediate sell trigger.
- id: a04
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    Monthly spreads in percentage points with recessions shaded. Inversion precedes recessions with a median
    lead of {expected.median_lead_months} months but a wide range ({expected.min_lead_months} to
    {expected.max_lead_months}). There were {expected.false_alarm_episodes_2s10s} false-alarm episodes for 2s10s.
    This does not prove causation and the sample of recessions is small. The PM should see inversion as an
    early, imprecise warning.
- id: a05
  kind: strong
