  text: >-
    Axes: time versus spread in percentage points; shading marks NBER recessions. Pattern: spreads drop below
    zero ahead of each downturn, then rebound once the Fed cuts. Size: a median lead of
    {expected.median_lead_months} months. Exceptions: the recent long inversion without a recession, and the
    pandemic miss. Limits: few events, so chance and common drivers cannot be ruled out. Business: use it as an
    early warning with a long, variable lead.
