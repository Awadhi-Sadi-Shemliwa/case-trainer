  note: Strength given as a count rather than lead months.
  text: >-
    It plots 10y-2y and 10y-3m spreads (percentage points) with grey recession bars. The curve usually inverts
    before recessions and steepens during them. {expected.recessions_signalled_2s10s} of
    {expected.recessions_evaluable_2s10s} recessions had a prior 2s10s inversion. False alarms exist, like the
    recent one, and the pandemic recession was missed. It is association, not cause. So the PM gets a
    heads-up, not a precise timing tool.
- id: a06
  kind: strong
  label: acceptable
