  text: Not cheating. The decision is made in expansions, and once a recession is underway the warning has no value.
    Inside recessions the curve steepens because the Fed cuts rates, so those rows reverse the pattern. R-squared
    rose to {expected.pseudo_r2_10y3m}. The same exclusion is applied out-of-sample, and it was chosen by logic
    not by test results.
  note: Claims the rule was set before seeing results; provenance shows the poor first result prompted it.
