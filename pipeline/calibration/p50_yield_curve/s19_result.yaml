step: s19_result
answers:
- id: a01
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    Claim: the curve, especially 10y-3m, ranks risky months well but its probabilities are not reliable at face
    value. Evidence: out-of-sample AUC {expected.auc_oos_10y3m} for 10y-3m versus {expected.auc_oos_2s10s} for
    2s10s, but the Brier skill score is {expected.bss_oos_10y3m}, worse than the base rate. Before the split it
    was {expected.bss_oos_pre_split_10y3m}. Reasoning: one long recent false alarm with high probabilities and
    no recession ruined calibration, consistent with a lower term premium making the slope overstate risk.
    Limitation: only {expected.n_oos_recessions} recessions in the test.
- id: a02
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    The model discriminates well but is poorly calibrated. AUC is {expected.auc_oos_10y3m} for 10y-3m, beating
    2s10s at {expected.auc_oos_2s10s}. Brier skill is negative overall, but it was positive at
    {expected.bss_oos_pre_split_10y3m} before the recent inversion. Since then the model averaged
    {expected.mean_prob_post_split_10y3m} and no recession came, so overconfidence comes from that false alarm,
    possibly a regime change in term premiums. Caveat: few recessions, and the split is post-hoc.
- id: a03
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    The yield curve is a useful warning but overconfident lately. 10y-3m ranks months better than 2s10s
    (AUC {expected.auc_oos_10y3m} vs {expected.auc_oos_2s10s}). Yet calibration failed: Brier skill
    {expected.bss_oos_10y3m}, driven by the recent false alarm; before it skill was
    {expected.bss_oos_pre_split_10y3m}. The relationship may have shifted because term premiums fell. Limitation:
    {expected.n_oos_recessions} test recessions and USREC is revised, so real-time results could differ.
- id: a04
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    Claim: good at ranking, bad at probability levels recently. Evidence: AUC {expected.auc_oos_10y3m}
    (10y-3m), higher than 2s10s; Brier skill negative, though {expected.bss_oos_pre_split_10y3m} before the
    split. Reasoning: one long false alarm with high predicted probability and no recession. That matches the
    Fed note that the slope may overstate risk when term premiums are low. Limitation: small number of
    recessions, so noisy estimates.
