    Brier skill {expected.bss_oos_10y3m}, whereas before the split it was {expected.bss_oos_pre_split_10y3m}.
    The cause is the recent long false alarm, perhaps a structural change in term premium. Only
    {expected.n_oos_recessions} recessions were tested.
