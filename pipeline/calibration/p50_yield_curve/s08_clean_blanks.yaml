step: s08_clean_blanks
answers:
- id: a01
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    We dropped the blank rows. They are bond market holidays such as Christmas and July 4th when there is no
    trading, so no true yield exists. I rejected forward filling because it would invent a trading day, and
    filling with zero would create fake inversions. Since the next step averages each month, dropping keeps
    the monthly mean unbiased.
- id: a02
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    Action: removed and logged the empty days. Reason: they line up with market holidays (Veterans Day,
    Independence Day, Christmas, New Year), not errors. Alternative: ffill or interpolation would add values
    that never existed; zero would look like a flat curve. Downstream we take a monthly mean, which is
    unaffected by dropping holidays.
- id: a03
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    The missing values are holidays when the market is closed, so I deleted those rows and recorded the count.
    Imputing them with zero would pull the monthly average towards zero and look like inversion. Forward fill
    double counts the previous day. Because we resample to monthly averages next, removing them is safe.
- id: a04
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    Dropped. No trading on holidays means no spread to observe. If we filled with zero we would distort the
    monthly average and create false signals; forward filling gives extra weight to the day before. The
    monthly mean over the real trading days is what we want.
- id: a05
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    The pipeline excluded the blank dates after checking they were the holiday calendar. Removing them is
    fine because the monthly mean only needs actual trading days. I rejected interpolation, which invents
    data, and zero fill, which creates fake inversions. Skipping the log would lose the audit trail.
- id: a06
  kind: strong
  label: acceptable
  owner_review: true
  note: Does not explicitly say "monthly" but says averaging.
  text: >-
    We removed the empty days because they are Christmas, New Year and other holidays with no trading.
    Filling them with zero would fake an inverted curve, and forward fill adds a made-up observation. Since we
    average later, dropping does not bias the result.
