step: s13_chart_forward
answers:
- id: a01
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    Each dot is an expansion month: x is the 2s10s spread that month, y is one if a recession began within the
    next twelve months. The dashed line is the probit fitted probability. The lower the spread, the higher the
    probability. But only {expected.base_rate_next12} of months are followed by a recession, and even at low
    spreads most months have no recession. The months overlap so they are not independent, and it shows
    association not causation.
- id: a02
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    x-axis: current spread in percentage points; y-axis: binary outcome, recession ahead or not, plus the
    fitted probability curve. Probability falls as the spread rises; steep curves are almost never followed by
    recession. The probit slope is {expected.probit_slope_2s10s}. Many dots at zero sit left of the vertical
    line, so the signal shifts odds rather than giving certainty. Neighbouring months share the same future
    recession, so they are not independent.
- id: a03
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    It plots this month's 2s10s spread against whether a recession followed within the year (0/1), with a
    probit curve and observed shares per bin. Flatter or inverted curves are linked to higher recession
    probability. The base rate is only {expected.base_rate_next12}. There is a lot of overlap between the
    zero and one dots, so it raises the odds, not certainty. The most inverted bin is low because of the
    recent false alarm. Association, not causation.
- id: a04
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    Dots: months coded one if a recession followed within twelve months, against the current spread. Dashed:
    probit fit with slope {expected.probit_slope_2s10s} and pseudo R-squared {expected.pseudo_r2_2s10s}. Lower
    spread, higher chance. Still, most low-spread months were not followed by a recession. Observations
    overlap in time so they are autocorrelated; this is association only.
- id: a05
  kind: strong
  label: acceptable
  owner_review: true
  note: Mentions base rate without number but gives slope.
  text: >-
    The chart relates the spread now to recession within the horizon. The fitted probability declines as the
    spread increases, slope {expected.probit_slope_2s10s}. Most months near zero still show no recession, so
    it is a probability, not a guarantee. Months are not independent. Does not show cause.
