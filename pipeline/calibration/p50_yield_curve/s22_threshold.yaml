  text: >-
    Trigger metric: the probit probability of recession within twelve months from the 10y-3m spread. Value:
    {expected.threshold}, which is the 10y-3m spread falling to about {expected.trigger_spread_10y3m} points.
    Action: start reducing equity exposure in steps. Expected error: it caught {expected.oos_hit_rate} of
