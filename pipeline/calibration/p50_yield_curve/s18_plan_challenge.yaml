step: s18_plan_challenge
answers:
- id: a01
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    The random split assumes months are independent, but they are time-ordered and their twelve-month targets
    overlap, so shuffling leaks future information into training and inflates AUC. Fix: an expanding window
    where each forecast uses only rows whose target was known at that date (a twelve-month embargo). Adding the
    current recession indicator is target leakage; NBER publishes it months later, so drop it. And AUC alone
    only measures ranking: also report the Brier score against the base rate and hit/false-alarm rates at a
    threshold. Our honest out-of-sample AUC was {expected.auc_oos_10y3m} with Brier skill {expected.bss_oos_10y3m}.
- id: a02
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    Three flaws. One: shuffling a time series puts neighbouring, overlapping months into both train and test,
    which leaks the future. Use a walk-forward, time-based split with an embargo. Two: this month's USREC is
    part of the target and not known in real time, which is leakage. Three: a high AUC does not mean calibrated
    probabilities; check the Brier score versus the base rate and the false-alarm rate. I would check the fix by
    comparing in-sample and out-of-sample AUC.
- id: a03
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    Assumption: observations are independent. Fails because targets overlap by most of a year, so random
    train/test splits leak. Fix: expanding-window out-of-sample test, training only on rows with a known
    target at the forecast date. The recession dummy as a feature is leakage, since it is what we predict and
    NBER dates it after the fact. Finally, report calibration (Brier) and a threshold's false alarms, not just
    AUC. Out-of-sample AUC was {expected.auc_oos_10y3m}, lower than in-sample {expected.auc_insample_10y3m}.
- id: a04
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    For time series you must split by time, not randomly. Overlapping targets mean neighbours are nearly
    duplicates, so a random split leaks. Use an expanding window with an embargo cutoff. The current recession
    indicator cannot be a feature: it is not known in real time and is basically the answer. And AUC measures
    ranking only. Add the Brier score against climatology and the hit and false alarm rates.
- id: a05
  kind: strong
  label: acceptable
  owner_review: true
  note: Fix for split is described without the word embargo.
  text: >-
    The random split leaks future data because months are ordered and overlap. Instead train on the past and
    test on later months only, refitting as time moves forward. Using this month's recession flag is leakage:
    the flag is announced later and is part of the target. AUC is not enough because it ignores calibration;
    use the Brier score and a threshold with false-alarm rates.
- id: a06
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    Leakage twice: a random split mixes overlapping future months into training, and the current USREC
    feature is the target itself and unknown in real time. Fix with a time-based expanding window and an
    embargo, and remove the recession feature. Then report Brier skill against the base rate as well as AUC:
    our out-of-sample AUC {expected.auc_oos_10y3m} looked fine but Brier skill was {expected.bss_oos_10y3m}.
