  label: acceptable
  owner_review: false
  text: >-
    It assumes rows are exchangeable. They are not: each target covers the next twelve months, so random
    splits let the model see the future. Fix it with walk-forward validation that only trains on rows with
    targets known at the forecast date, then check that the out-of-sample AUC ({expected.auc_oos_10y3m}) is
    below in-sample. The current recession indicator is leakage and unavailable in real time. And measure
    calibration with the Brier score versus the base rate, plus false alarms at a threshold.
