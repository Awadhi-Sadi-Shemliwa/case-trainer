# Calibration answers for s05_predict_data (data_expectation). Labels are the human judgement:
# acceptable = should pass (>= 85, no critical red flag). owner_review: true = Awadhi should check the label.
# {expected.key} placeholders are resolved exactly like content text; deliberately wrong numbers are typed.
step: s05_predict_data
answers:
- id: a01
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    T10Y2Y should be one row per trading day with the 10-year minus 2-year yield in percentage points, starting
    in the seventies. Bond market holidays like Christmas and July 4th will be blank because there is no
    trading. USREC is monthly and just a one or zero dummy. The trap is that daily and monthly do not join
    directly, so I need to average the spread to months first, and USREC is announced late by NBER so the
    latest zeros are provisional.
- id: a02
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    Grain: daily business-day observations for the spread, monthly for the recession flag. Units: percent
    (percentage points) for the spread, binary indicator for USREC. Missing values: market holidays will appear
    as empty cells or a marker, not zero. Trap: frequency mismatch, resample daily to monthly mean before the
    merge; also NBER dates recessions after the fact so USREC was not known in real time.
- id: a03
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    I expect a daily file with a date column and the spread in percentage points. Gaps on holidays when the
    bond market is closed. The recession series is monthly 0/1. Joining them naively on date would leave
    most daily rows unmatched, so aggregate to monthly averages first. Recent recession values may be
    revised later.
- id: a04
  kind: strong
  label: acceptable
  owner_review: false
  text: >-
    One row per trading day for T10Y2Y, measured in percentage points. USREC is a monthly dummy equal to one
    in recession months. Missing days will be holidays with no trading, so I would drop them rather than
    fill. Main trap: different frequencies, so I align by averaging the daily spread within each month before
    merging with USREC.
