answers:
- id: a01
  text: 'Testing four leagues at five percent makes a false positive likely, and reporting the one that worked is
    cherry-picking. Use a Holm correction: {expected.n_leagues_significant} leagues stay significant. Use one pooled
    pre-planned test instead: home win rate changed by {expected.hw_change}. ''Proves'' is causal, but congestion
    changed too. Total cards ignore fouls, so use cards per foul with a home comparison group (rate ratio {expected.rr_did}).'
  label: acceptable
  kind: strong
  owner_review: false
- id: a02
  text: Four tests mean multiple testing. After Holm no league is significant on its own, so the Premier League
    result is not convincing. A pooled test has more power and is the right primary test. Ghost games also came
    with fewer rest days, so say 'consistent with'. Raw card totals ignore fouls; model yellow cards per foul with
    a difference-in-differences.
  label: acceptable
  kind: strong
  owner_review: false
- id: a03
  text: 'Problems: multiple comparisons (one hit in four by chance), causal overclaim (congested fixtures confound),
    and card totals without a denominator or control group. Fixes: Holm correction plus a pooled test, ''consistent
    with'' language, and a Poisson model with a fouls offset and a home by ghost interaction. Check: the corrected
    p-values and the rate ratio''s confidence interval.'
  label: acceptable
  kind: strong
  owner_review: false
- id: a04
  text: The plan assumes each league test is independent evidence, but running four raises the false-positive chance.
    Correct with Holm, or test pooled. It assumes the crowd is the only change, but rest days fell from {expected.rest_fans}
    to {expected.rest_ghost}. It assumes cards measure bias, but you need cards per foul compared with home teams.
    The card rate ratio {expected.rr_did} is the right evidence.
  label: acceptable
  kind: strong
  owner_review: false
- id: a05
  text: 'Cherry-picking one significant league out of four is weak; adjust with Holm, where {expected.n_leagues_significant}
    remain. The pooled drop is the primary test. Total cards ignore fouling: use cards per foul and a difference-in-differences
    against home teams. And don''t say ''proves'': congestion is a confounder.'
  label: acceptable
  kind: strong
  owner_review: false
- id: a06
  text: 'Multiple testing: four leagues at five percent. Fix with Holm and a pooled test. Causation: congestion
    and partial crowds confound, so phrase it carefully. Cards: use a rate per foul with home teams as the comparison,
    a difference-in-differences. Check by reporting the adjusted p-values and the interaction''s confidence interval.'
  label: acceptable
  kind: strong
  owner_review: false
- id: a07
  text: Running separate tests and picking the winner inflates false positives; after correction no league is significant.
    Pool for power. Saying 'proves crowds create' ignores that fixtures were compressed. Raw away-card counts ignore
    fouls; the right measure is cards per foul relative to home teams, which shows a rate ratio of {expected.rr_did}.
  label: acceptable
  kind: strong
  owner_review: false
