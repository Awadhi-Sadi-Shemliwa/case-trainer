- id: a01
  text: 'Laps where the median gap to the car ahead was under {expected.traffic_gap_s} seconds were dropped and
    counted ({expected.n_drop_traffic}). Dirty air costs downforce and overheats the tyres, so the lap looks exactly
    like wear. Traffic also clusters early in stints after a stop, so it biases the slope rather than adding noise.
    I rejected keeping them and a far stricter rule. Checked: hard slope {expected.deg_hard_gap05} and {expected.deg_hard_gap20}
    under looser and stricter rules vs {expected.deg_hard}.'
  label: acceptable
  kind: strong
  owner_review: false
- id: a02
