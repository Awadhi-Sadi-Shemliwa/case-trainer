answers:
- id: a01
  text: 'Inside a stint tyre age and lap number rise together, so after removing stint means they''re identical:
    correlation {expected.within_stint_corr_age_lap}, rank {expected.stint_fe_rank} of {expected.stint_fe_columns}.
    The model can''t separate fuel from wear; dropping lap number makes hards look like they improve ({expected.naive_slope_hard}).
    Fix: a driver-race fixed effect, since pit stops reset age but not lap number ({expected.share_multi_stint}
    of driver-races have 2+ stints): hards lose {expected.deg_hard}. Second, a break chosen on all data always fits;
    choose it on other races and score on the held-out race.'
  label: acceptable
  kind: strong
  owner_review: false
- id: a02
  text: 'Part one fails: with a stint fixed effect, lap number and tyre age are the same variable within each stint,
    so fuel and wear aren''t identified. Use a fixed effect per driver per race instead; the pit stop resets tyre
    age while lap number keeps going, which separates them, giving {expected.deg_hard} for hards and a lap effect
    of {expected.fuel_slope}. Part two fails: an in-sample best break always looks better. Pick it on training races
    and test leave-one-race-out.'
  label: acceptable
  kind: strong
  owner_review: false
- id: a03
  text: 'Assumption: stint FE plus lap number controls fuel. Fails: within a stint the two are perfectly collinear
    ({expected.within_stint_corr_age_lap}). Fix: driver-race FE, identified by pit stops. Evidence: without fuel
    control hards seem to improve ({expected.naive_slope_hard}); with the fix they lose {expected.deg_hard}. Assumption:
    best-fitting break is the cliff. Fails: in-sample search always finds one. Fix: leave-one-race-out; then the
    break helps by under one percent and bends the wrong way, so {expected.n_compounds_with_cliff} compounds show
    a cliff.'
  label: acceptable
  kind: strong
  owner_review: false
- id: a04
  text: 'The textbook model isn''t identified: inside a stint each lap adds one to tyre age and one to lap number,
    so the design loses rank. Compare across stints of the same driver in the same race, where a stop resets age.
    The cliff must be chosen and tested on different races; in-sample it''s guaranteed to look like an improvement.'
  label: acceptable
  kind: strong
  owner_review: false
