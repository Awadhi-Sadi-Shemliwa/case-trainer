- id: a01
  text: 'x: tyre age in laps; y: lap time lost against the freshest age shown, after removing driver, race and the
    lap-number (fuel) effect. Dots are averages per age, dashed lines straight-line fits. Softs wear fastest ({expected.deg_soft}
    s per lap of age); mediums ({expected.deg_medium}) and hards ({expected.deg_hard}) are about the same. Lines
    stop where stints end: teams pit before tyres get old, so the oldest ages have few laps, from the stints kept
    out longest. It can''t show beyond those ages or circuit differences. So what: these rates feed the stint decision.'
  label: acceptable
  kind: strong
  owner_review: false
- id: a02
  text: 'Fuel-corrected loss vs tyre age for each compound. Soft {expected.deg_soft}, medium {expected.deg_medium},
    hard {expected.deg_hard} seconds per lap of age: softs clearly fastest, mediums and hards overlapping. The ends
    of the lines are thin because tyres are changed before they get very old, a censoring problem. It averages across
    circuits and can''t separate fuel from track evolution. Use the slopes, not the tails, for the strategy.'
  label: acceptable
  kind: strong
  owner_review: false
