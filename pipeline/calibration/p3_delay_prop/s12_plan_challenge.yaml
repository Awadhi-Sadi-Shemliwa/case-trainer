answers:
- id: a01
  text: 'Late aircraft is a downstream label, and a blanket thirty minutes ignores cost: extra minutes reduce aircraft
    utilisation, so target where delay accumulates. Comparing average delay of all flights by turn length confounds
    time and place and averaging early flights hides propagation; measure pass-through on the same aircraft: {expected.pass_b1}
    at the shortest turns vs {expected.pass_b5} at {expected.buffer_min_turn} minutes. The worst cell has {expected.worst_cell_deps}
    departures, so it''s noise. Check on Oct-Dec after estimating on Jan-Sep.'
  label: acceptable
  kind: strong
  owner_review: false
- id: a02
  text: 'Three flaws. A network-wide buffer is expensive and untargeted. Average delay over all flights by turn
    length is confounded and hides propagation; use same-aircraft pass-through. The brightest heatmap cell has a
    tiny denominator. Fix: target evening banks using the pass-through curve and validate on later months.'
  label: acceptable
  kind: strong
  owner_review: false
- id: a03
  text: 'The plan treats a label as a cause, ignores the cost of buffers, uses a confounded comparison of averages
    that include early flights, and chases a noisy small-sample cell. Instead: same-aircraft pass-through by turn
    band (falls from {expected.pass_b1} to {expected.pass_b5}), targeted to evening turns at bad airports, validated
    out of time.'
  label: acceptable
  kind: strong
  owner_review: false
- id: a04
  text: Blanket buffers cost utilisation; put them where propagation accumulates. Long turns are scheduled at particular
    times and places, so comparing all-flight averages misleads; follow the same aircraft. The worst cell rests
    on {expected.worst_cell_deps} flights. Validate the rule on months not used to set it.
  label: acceptable
  kind: strong
  owner_review: false
- id: a05
  text: 'Assumes: the label is the cause, minutes are free, averages compare like with like, and colours are reliable.
    Each fails: label is downstream, buffers cost utilisation, averages confound and include early flights, and
    the worst cell is tiny. Fix with targeted buffers based on same-aircraft pass-through, checked out of time.'
  label: acceptable
  kind: strong
  owner_review: false
- id: a06
  text: Adding thirty minutes everywhere wastes aircraft time; the effect isn't linear either. Use pass-through
    on the same aircraft to find where minutes start working ({expected.buffer_min_turn}-minute turns pass on {expected.pass_b5}).
    Don't size buffers by one noisy heatmap cell. Test on Oct-Dec.
  label: acceptable
  kind: strong
  owner_review: false
- id: a07
  text: 'Wrong evidence: average delay of all flights by turn length is confounded. Right evidence: same-aircraft
    pass-through. Wrong scope: every turn; right scope: evening turns at the worst airports, given cost. Wrong target:
    the brightest small-sample cell. Check: time-split stability.'
  label: acceptable
  kind: strong
  owner_review: false
