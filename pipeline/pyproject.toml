[project]
name = "case-trainer-pipeline"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "jsonschema==4.26.0",
    "matplotlib==3.11.2",
    "nbformat==5.11.1",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "cases"]
python_files = ["test_*.py"]
