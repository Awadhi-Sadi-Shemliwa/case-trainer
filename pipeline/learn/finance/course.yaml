# Finance Foundations: 300 words in three tiers, ranked from most to least important (owner request 2026-11-15).
# Order matters: rank = position (tier -> lesson -> word). Each lesson leans only on words from earlier lessons.
# Definitions are written fresh for this app; `sources` are the pages they were checked against (VERIFIED in
# sources.json). Worked examples use made-up numbers computed by the pipeline (common/glossary.py).
id: finance
title: Finance Foundations
allowed_literals: ["S&P 500", "FTSE 100", "2s10s", "10y-3m", "10-year", "2-year", "3-month", "P/E", "EV/EBITDA",
                   "GARCH(1,1)", "AR(1)", "MA(1)", "Fama-French three-factor", "VIX", "SONIA", "SOFR", "AAA", "BBB",
                   "BBB-", "T10Y2Y", "T10Y3M", "USREC", "401(k)", "P50", "P34", "P13", "P3"]
tiers:
  - id: core
    title: Core
    blurb: The hundred words you need to follow financial news and the P50 yield-curve case.
    read_next: [book_napkin_finance, book_economist_markets]
    lessons:
      - id: core_01_money
        title: Money and ownership
        blurb: What you own, what you owe, and what is left over.
        sources: [finra_stocks, sec_financial_statements]
      - id: core_02_interest
        title: Interest and time
        blurb: Why a pound today is worth more than a pound next year.
        sources: [boe_interest_rates_explainer]
      - id: core_03_economy
        title: The economy
        blurb: How a whole country's output grows, shrinks and gets more expensive.
        sources: [bea_gdp, nber_business_cycle_dating, boe_inflation_explainer]
      - id: core_04_central_banks
        title: Central banks and government
        blurb: Who sets interest rates, and why they move them.
        sources: [fed_monetary_policy, boe_interest_rates_explainer, boe_quantitative_easing]
      - id: core_05_bonds
        title: Bonds
        blurb: Lending to a government or company, and what you get back.
        sources: [finra_bonds, treasurydirect_bonds]
      - id: core_06_yield_curve
        title: The yield curve
        blurb: The picture of rates by maturity, and why its shape worries investors.
        sources: [estrella_mishkin_1996, nyfed_ycfaq]
      - id: core_07_companies
        title: Companies and shares
        blurb: Owning a slice of a business, and how the market prices it.
        sources: [finra_stocks]
      - id: core_08_markets
        title: Markets
        blurb: The moods and mechanics of prices going up and down.
        sources: [finra_stocks]
      - id: core_09_risk
        title: Risk and portfolios
        blurb: Why you are paid to take risk, and how to spread it.
        sources: [finra_asset_allocation]
      - id: core_10_accounts
        title: Accounts and value
        blurb: Reading a company's numbers and putting a value on it.
        sources: [sec_financial_statements]

  - id: intermediate
    title: Intermediate
    blurb: Instruments, valuation and the plumbing behind markets.
    read_next: [book_random_walk, book_hull_derivatives]
    lessons:
      - id: int_01_derivatives
        title: Derivatives
        blurb: Contracts whose value comes from something else.
        sources: [finra_options, cftc_futures_basics]
      - id: int_02_derivatives_at_work
        title: Derivatives at work
        blurb: Swaps, payoffs and who carries which risk.
        sources: [finra_options]
      - id: int_03_valuation
        title: Valuing a company
        blurb: From profits to cash flows to a price for the whole business.
        sources: [sec_financial_statements]
      - id: int_04_company_health
        title: Company health
        blurb: Can it pay its bills, and how much debt is too much?
        sources: [sec_financial_statements]
      - id: int_05_bonds_deeper
        title: Bonds, deeper
        blurb: Measuring a bond's return and its sensitivity to rates.
        sources: [finra_bonds, treasurydirect_bonds]
      - id: int_06_banking
        title: Banking and borrowing
        blurb: How banks fund loans, and the rates they lend to each other at.
        sources: [boe_sonia, boe_interest_rates_explainer]
      - id: int_07_risk_metrics
        title: Measuring risk
        blurb: Putting numbers on how much returns wobble and move together.
        sources: [finra_asset_allocation]
      - id: int_08_market_plumbing
        title: Market plumbing
        blurb: Orders, middlemen and the costs of trading.
        sources: [finra_stocks]
      - id: int_09_funds
        title: Funds and investing styles
        blurb: Ways to hand your money to someone else, and what it costs.
        sources: [finra_asset_allocation]
      - id: int_10_global
        title: Currencies, commodities and the cycle
        blurb: Exchange rates, raw materials and how economies slow down.
        sources: [cftc_futures_basics, boe_inflation_explainer]

  - id: quant
    title: Quant and machine learning
    blurb: The data-science side of finance, the language of your MSc and of the ML in Finance book.
    read_next: [book_dixon_ml_finance]
    lessons:
      - id: q01_returns
        title: Returns, properly
        blurb: The many ways to turn prices into returns, and their shapes.
        sources: [book_dixon_ml_finance]
      - id: q02_time_series
        title: Time series
        blurb: Data in time order, and what makes it predictable or not.
        sources: [nist_stationarity, book_dixon_ml_finance]
      - id: q03_volatility
        title: Volatility models
        blurb: Calm and storm come in clusters; models that know it.
        sources: [book_dixon_ml_finance]
      - id: q04_factors
        title: Factors and benchmarks
        blurb: Splitting a return into what the market paid and what was skill.
        sources: [book_dixon_ml_finance]
      - id: q05_backtesting
        title: Backtesting honestly
        blurb: Testing a strategy on the past without fooling yourself.
        sources: [book_dixon_ml_finance]
      - id: q06_microstructure
        title: Inside the order book
        blurb: How prices are actually formed, trade by trade.
        sources: [book_dixon_ml_finance]
      - id: q07_portfolios
        title: Building portfolios
        blurb: Choosing weights with maths instead of gut feeling.
        sources: [book_dixon_ml_finance, finra_asset_allocation]
      - id: q08_pricing
        title: Pricing derivatives
        blurb: The no-free-lunch logic behind option prices.
        sources: [book_hull_derivatives]
      - id: q09_credit
        title: Credit, mortgages and pairs
        blurb: Predicting default, prepayment and prices that move together.
        sources: [book_dixon_ml_finance]
      - id: q10_ml_signals
        title: Judging signals and hidden states
        blurb: Scoring forecasts and finding the regime the market is in.
        sources: [book_dixon_ml_finance, estrella_mishkin_1996]
