# Intermediate lesson 3 · Valuing a company. Words 121-130.
- id: free_cash_flow
  term: Free cash flow
  aliases: [FCF, free cash flows]
  short: Cash a business generates after paying its running costs and the investment needed to keep and grow it.
  plain: >-
    It is the cash that could go to lenders and owners without harming the business. Valuation models discount
    it, because it is what an owner of the whole business could actually take out.
  formula:
    tex: '\mathrm{FCF} = \mathrm{operating\ cash\ flow} - \mathrm{capex}'
    plain: Free cash flow = cash from operations − capital expenditure
    symbols:
      - {symbol: operating cash flow, means: cash generated by running the business}
      - {symbol: capex, means: spending on long-lasting assets}
  example:
    values: {ocf: 120, capex: 45}
    compute: {fcf: ocf - capex}
    formats: {ocf: '£{:,.0f}m', capex: '£{:,.0f}m', fcf: '£{:,.0f}m'}
    text: Cash from operations of {ocf} minus capital spending of {capex} leaves free cash flow of {fcf}.
  fools_you: >-
    One year can mislead: a company that slashes investment boosts this figure now and weakens itself later.
  related: [cash_flow, capex, discounted_cash_flow, cash_flow_statement]
  sources: [sec_financial_statements]

- id: ebitda
  term: EBITDA
  short: Earnings before interest, tax, depreciation and amortisation, the profit from operations before financing, tax and non-cash charges.
  plain: >-
    It is popular because it compares businesses with different debts and tax situations, and it sits close
    to operating cash before investment. It is also the bottom half of common valuation multiples.
  formula:
    tex: '\mathrm{EBITDA} = \mathrm{operating\ profit} + \mathrm{depreciation} + \mathrm{amortisation}'
    plain: EBITDA = operating profit + depreciation + amortisation
    symbols:
      - {symbol: operating profit, means: profit before interest and tax}
      - {symbol: depreciation and amortisation, means: yearly charges for wear on assets}
  example:
    values: {op: 80, dep: 25, am: 5}
    compute: {e: op + dep + am}
    formats: {op: '£{:,.0f}m', dep: '£{:,.0f}m', am: '£{:,.0f}m', e: '£{:,.0f}m'}
    text: Operating profit of {op} plus depreciation of {dep} and amortisation of {am} gives EBITDA of {e}.
  fools_you: >-
    It ignores the cost of replacing worn-out equipment, which is why sceptics call it profit before all the
    inconvenient costs.
  related: [operating_profit, depreciation, ev_ebitda, free_cash_flow]

- id: discounted_cash_flow
  term: Discounted cash flow (DCF)
  aliases: [DCF, DCF model, DCF valuation]
  short: Valuing a business by forecasting its free cash flows and discounting them back to today.
  plain: >-
    It is net present value applied to a whole company. Its strength is that it forces you to write down your
    assumptions about growth, margins and investment, so others can argue with them.
  formula:
    tex: 'V = \sum_{t=1}^{n} \frac{FCF_{t}}{(1 + r)^{t}} + \frac{TV}{(1 + r)^{n}}'
    plain: Value = sum of discounted free cash flows + discounted terminal value
    symbols:
      - {symbol: FCF t, means: free cash flow in year t}
      - {symbol: TV, means: terminal value at year n}
      - {symbol: r, means: discount rate}
  example:
    values: {f1: 50, f2: 55, f3: 60, tv: 900, r: 0.09}
    compute: {v: f1 / (1 + r) + f2 / (1 + r) ** 2 + (f3 + tv) / (1 + r) ** 3}
    formats: {f1: '£{:,.0f}m', f2: '£{:,.0f}m', f3: '£{:,.0f}m', tv: '£{:,.0f}m', r: '{:.0%}', v: '£{:,.0f}m'}
    text: Free cash flows of {f1}, {f2} and {f3}, plus a terminal value of {tv} at the end of the third year, discounted at {r}, give a value of {v}.
  fools_you: >-
    Most of the answer usually sits in the terminal value, far in the future, so the precise-looking result
    rests on the least certain guesses.
  related: [free_cash_flow, terminal_value, wacc, net_present_value, valuation]

- id: terminal_value
  term: Terminal value
  aliases: [continuing value]
  short: The value of all cash flows beyond the forecast years, squeezed into one number at the end of a valuation.
  plain: >-
    Forecasting year by year forever is impossible, so analysts assume steady growth after a few years and use
    a formula for a growing stream of payments that never ends.
  formula:
    tex: 'TV = \frac{FCF_{n}\,(1 + g)}{r - g}'
    plain: Terminal value = next year's free cash flow ÷ (discount rate − growth rate)
    symbols:
      - {symbol: FCF n, means: free cash flow in the last forecast year}
      - {symbol: g, means: steady growth rate forever after}
      - {symbol: r, means: discount rate}
  example:
    values: {f: 60, g: 0.02, r: 0.09}
    compute: {tv: f * (1 + g) / (r - g)}
    formats: {f: '£{:,.0f}m', g: '{:.0%}', r: '{:.0%}', tv: '£{:,.0f}m'}
    text: If a cash flow of {f} grows at {g} a year forever and the discount rate is {r}, the terminal value is {tv}.
  fools_you: >-
    The result explodes as growth approaches the discount rate: small tweaks to either can double the value.
  related: [discounted_cash_flow, wacc, valuation]

- id: cost_of_equity
  term: Cost of equity
  short: The return shareholders expect for owning a company's shares, given how risky they are.
  plain: >-
    No invoice shows it: it is an opportunity cost. Analysts usually estimate it as the risk-free rate plus a
    premium scaled by how much the share moves with the market, a model you will meet in the quant tier.
  formula:
    tex: 'r_{E} = r_{f} + \beta\,(E[R_{m}] - r_{f})'
    plain: Cost of equity = risk-free rate + beta × market risk premium
    symbols:
      - {symbol: r f, means: risk-free rate}
      - {symbol: β, means: the share's beta}
      - {symbol: 'E[Rm] − rf', means: expected market return above the risk-free rate}
  example:
    values: {rf: 0.04, b: 1.2, mrp: 0.05}
    compute: {re: rf + b * mrp}
    formats: {rf: '{:.0%}', b: '{:.1f}', mrp: '{:.0%}', re: '{:.0%}'}
    text: With a risk-free rate of {rf}, a beta of {b} and a market premium of {mrp}, the cost of equity is {re}.
  fools_you: >-
    It is an estimate with wide error bars; small changes to beta or the premium move valuations a lot.
  related: [wacc, capm, beta, risk_premium]

- id: cost_of_debt
  term: Cost of debt
  short: The interest rate a company effectively pays on its borrowing, usually counted after the tax saving on interest.
  plain: >-
    It is roughly the yield on the company's bonds or the rate on its loans. Because interest reduces taxable
    profit in many countries, the after-tax figure is lower than the headline rate.
  formula:
    tex: 'r_{D}^{\mathrm{after\ tax}} = r_{D}\,(1 - t)'
    plain: After-tax cost of debt = interest rate × (1 − tax rate)
    symbols:
      - {symbol: r D, means: interest rate on the debt}
      - {symbol: t, means: tax rate}
  example:
    values: {rd: 0.06, t: 0.25}
    compute: {after: rd * (1 - t)}
    formats: {rd: '{:.0%}', t: '{:.0%}', after: '{:.1%}'}
    text: Borrowing at {rd} with a tax rate of {t} costs {after} after tax.
  fools_you: >-
    Cheap borrowing gets dearer the more you take on: lenders charge riskier, more indebted firms more.
  related: [wacc, loan, bond, debt_to_equity]

- id: wacc
  term: WACC (weighted average cost of capital)
  aliases: [WACC, weighted average cost of capital, cost of capital]
  short: The average return a company must earn for all its investors, lenders and shareholders alike, weighted by how much each provides.
  plain: >-
    It is the hurdle rate: projects must earn more than it to create value, and company valuations usually use
    it as the discount rate.
  formula:
    tex: '\mathrm{WACC} = \frac{E}{V}\,r_{E} + \frac{D}{V}\,r_{D}\,(1 - t)'
    plain: WACC = equity share × cost of equity + debt share × after-tax cost of debt
    symbols:
      - {symbol: E and D, means: market values of equity and debt}
      - {symbol: V, means: E + D}
      - {symbol: r E and r D, means: costs of equity and debt}
  example:
    values: {E: 600, D: 400, re: 0.10, rd: 0.06, t: 0.25}
    compute: {w: E / (E + D) * re + D / (E + D) * rd * (1 - t)}
    formats: {E: '£{:,.0f}m', D: '£{:,.0f}m', re: '{:.0%}', rd: '{:.0%}', t: '{:.0%}', w: '{:.1%}'}
    text: With equity of {E} costing {re} and debt of {D} at {rd} before a {t} tax rate, WACC is {w}.
  fools_you: >-
    One company-wide rate for every project undervalues safe projects and overvalues risky ones.
  related: [cost_of_equity, cost_of_debt, discounted_cash_flow, debt_vs_equity_financing]

- id: enterprise_value
  term: Enterprise value (EV)
  aliases: [EV]
  short: The value of a whole business to all its investors, its market capitalisation plus its debt minus its cash.
  plain: >-
    Buying a company means taking on its debts and getting its cash, so this is the real price tag of the
    business. It is the right figure to set against measures that belong to all investors, like EBITDA.
  formula:
    tex: '\mathrm{EV} = \mathrm{market\ cap} + \mathrm{debt} - \mathrm{cash}'
    plain: Enterprise value = market capitalisation + debt − cash
    symbols:
      - {symbol: market cap, means: share price × shares}
      - {symbol: debt, means: borrowings}
      - {symbol: cash, means: cash and near-cash held}
  example:
    values: {mc: 10000, d: 2500, c: 800}
    compute: {ev: mc + d - c}
    formats: {mc: '£{:,.0f}m', d: '£{:,.0f}m', c: '£{:,.0f}m', ev: '£{:,.0f}m'}
    text: A market capitalisation of {mc} plus debt of {d} minus cash of {c} gives an enterprise value of {ev}.
  fools_you: >-
    A company can look cheap on market capitalisation and expensive once its debt is added.
  related: [market_cap, ev_ebitda, valuation]

- id: ev_ebitda
  term: EV/EBITDA multiple
  aliases: [EV/EBITDA]
  short: Enterprise value divided by EBITDA, a common way to compare how expensive businesses are whatever their debts.
  plain: >-
    Because both halves belong to all investors, it compares companies with very different borrowing fairly.
    Takeovers are often priced as a multiple of this kind.
  formula:
    tex: '\mathrm{multiple} = \frac{\mathrm{EV}}{\mathrm{EBITDA}}'
    plain: Multiple = enterprise value ÷ EBITDA
    symbols:
      - {symbol: EV, means: enterprise value}
      - {symbol: EBITDA, means: yearly operating profit before depreciation}
  example:
    values: {ev: 11700, e: 1300}
    compute: {m: ev / e}
    formats: {ev: '£{:,.0f}m', e: '£{:,.0f}m', m: '{:.1f}'}
    text: An enterprise value of {ev} and EBITDA of {e} make a multiple of {m} times.
  fools_you: >-
    Multiples differ by industry for good reasons; a cheap-looking one may reflect slow growth or heavy
    investment needs.
  related: [enterprise_value, ebitda, pe_ratio, valuation]

- id: price_to_book
  term: Price-to-book ratio (P/B)
  aliases: [P/B, book value, price to book]
  short: A company's market value divided by the equity shown on its balance sheet.
  plain: >-
    A ratio below one means the market values the company at less than its accounts say its net assets are
    worth, common for troubled banks or businesses whose assets are doubtful. It suits asset-heavy businesses
    better than software firms.
  formula:
    tex: 'P/B = \frac{\mathrm{market\ cap}}{\mathrm{book\ equity}}'
    plain: P/B = market capitalisation ÷ equity on the balance sheet
    symbols:
      - {symbol: market cap, means: value the market puts on the shares}
      - {symbol: book equity, means: equity in the accounts}
  example:
    values: {mc: 2400, be: 3000}
    compute: {pb: mc / be}
    formats: {mc: '£{:,.0f}m', be: '£{:,.0f}m', pb: '{:.1f}'}
    text: A bank worth {mc} on the market with {be} of equity in its accounts trades at a ratio of {pb}.
  fools_you: >-
    The accounting figure can be stale, or flattered by assets that would sell for far less.
  related: [balance_sheet, market_cap, equity, valuation]
