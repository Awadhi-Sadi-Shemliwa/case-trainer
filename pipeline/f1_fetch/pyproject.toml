# Isolated environment for the FastF1 download step ONLY (P13 and later F1 cases).
# FastF1 3.9.2 requires pandas<3, while the main pipeline is pinned to pandas 3.x.
# Use: cd pipeline && uv run --project f1_fetch python -m cases.p13_tyre_deg.download
[project]
name = "case-trainer-f1-fetch"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastf1==3.9.2",
    "pyarrow",
]
